<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#79c4d1">
<title>荒岛生存法则</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #79c4d1;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  /* 游戏容器：铺满屏幕，禁止手势滚动 */
  #wrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
  }

  #stage {
    position: absolute;
    inset: 0;
    display: block;
  }

  /* ---------- 左上角：资源数量 + 提示文字 ---------- */
  .hud-left {
    position: absolute;
    left: 0;
    top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 0 0 calc(env(safe-area-inset-left, 0px) + 14px);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    pointer-events: none;
  }

  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px 4px 8px;
    background: rgba(255, 252, 240, 0.94);
    border: 2px solid #4a3a2a;
    border-radius: 11px;
    box-shadow: 0 3px 0 rgba(74, 58, 42, 0.18);
    font-size: 13px;
    font-weight: 700;
    color: #4a3a2a;
  }

  .chip .dot {
    width: 12px;
    height: 12px;
    border: 2px solid #4a3a2a;
    flex: none;
  }
  .chip .dot.wood  { background: #a9784c; border-radius: 3px; transform: rotate(-10deg); }
  .chip .dot.stone { background: #c9c9c0; border-radius: 50%; }
  .chip .dot.flint { background: #f0a24a; border-radius: 2px; transform: rotate(45deg); }
  .chip .dot.shell { background: #f6e8d2; border-radius: 50% 50% 50% 2px; }
  .chip .dot.berry { background: #c2452f; border-radius: 50%; }
  .chip .dot.fish  { background: #8fd6e8; border-radius: 50% 50% 50% 2px; }
  .chip .dot.food  { background: #e8b23f; border-radius: 50%; }
  .chip .dot.cooked { background: #d9873f; border-radius: 50% 50% 50% 2px; }

  .chip .num {
    min-width: 16px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* 可以点着吃的资源（鱼 / 食物） */
  .chip.eat {
    pointer-events: auto;
    cursor: pointer;
    padding-right: 6px;
  }
  .chip.eat:active { transform: scale(0.95); }

  .chip .tag {
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 6px;
    background: #7ba85c;
    color: #fff8e6;
    margin-left: 1px;
  }
  .chip.eat.empty .tag { background: #b8b0a0; }

  /* 采集成功时左上角弹一下的文字 */
  #toast {
    padding: 5px 11px;
    border-radius: 10px;
    background: rgba(74, 58, 42, 0.86);
    color: #fff8e6;
    font-size: 13px;
    font-weight: 700;
    opacity: 0;
    transform: translateY(-6px);
  }
  #toast.show { animation: toastPop 1.3s ease-out forwards; }

  @keyframes toastPop {
    0%   { opacity: 0; transform: translateY(-8px) scale(0.94); }
    12%  { opacity: 1; transform: translateY(0) scale(1); }
    74%  { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-4px) scale(0.98); }
  }

  /* ---------- 右上角：饥饿条 ---------- */
  .hud-right {
    position: absolute;
    right: 0;
    top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-right, 0px) + 14px) 0 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    pointer-events: none;
  }

  .hunger {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    padding: 8px 10px;
    background: rgba(255, 252, 240, 0.94);
    border: 2px solid #4a3a2a;
    border-radius: 12px;
    box-shadow: 0 3px 0 rgba(74, 58, 42, 0.18);
  }

  .hunger-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #4a3a2a;
  }

  .bar {
    width: 86px;
    height: 12px;
    border: 2px solid #4a3a2a;
    border-radius: 999px;
    background: #f1e7d1;
    overflow: hidden;
  }

  #hungerFill {
    height: 100%;
    width: 100%;
    background: #7cc26b;
    transition: background 0.35s linear;
  }

  /* 饥饿条下面的音效开关 */
  #soundBtn {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 50%;
    border: 2px solid #4a3a2a;
    background: rgba(255, 252, 240, 0.94);
    box-shadow: 0 3px 0 rgba(74, 58, 42, 0.18);
    color: #4a3a2a;
    pointer-events: auto;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  #soundBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(74, 58, 42, 0.18); }
  #soundBtn svg { width: 19px; height: 19px; display: block; }
  #soundBtn .ico-off { display: none; }
  #soundBtn.off { opacity: 0.62; }
  #soundBtn.off .ico-on { display: none; }
  #soundBtn.off .ico-off { display: block; }

  /* ---------- 顶部中间：第几天 + 当前时段 ---------- */
  #dayChip {
    position: absolute;
    left: 50%;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px 5px 9px;
    background: rgba(255, 252, 240, 0.94);
    border: 2px solid #4a3a2a;
    border-radius: 12px;
    box-shadow: 0 3px 0 rgba(74, 58, 42, 0.18);
    font-size: 13px;
    font-weight: 700;
    color: #4a3a2a;
    pointer-events: none;
    white-space: nowrap;
  }

  #dayChip .d-icon { width: 15px; height: 15px; display: block; flex: none; }
  #dayChip .d-icon svg { width: 100%; height: 100%; display: block; }

  #dayChip .d-phase {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #8a7860;
  }

  /* ---------- 左下角：虚拟摇杆 ---------- */
  #joystick {
    position: absolute;
    left: calc(env(safe-area-inset-left, 0px) + 18px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    width: 116px;
    height: 116px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 42%,
                rgba(255, 252, 240, 0.34),
                rgba(255, 252, 240, 0.14) 70%,
                rgba(255, 252, 240, 0.08));
    border: 2px solid rgba(74, 58, 42, 0.40);
    box-shadow: inset 0 0 0 6px rgba(255, 255, 255, 0.16),
                0 6px 16px rgba(18, 52, 62, 0.16);
    touch-action: none;
    backdrop-filter: blur(1px);
    -webkit-backdrop-filter: blur(1px);
  }

  /* 底盘中间的十字小刻线，让摇杆看起来更"仪表"一点 */
  #joystick::before,
  #joystick::after {
    content: '';
    position: absolute;
    background: rgba(74, 58, 42, 0.16);
    border-radius: 2px;
  }
  #joystick::before { left: 50%; top: 16px; bottom: 16px; width: 1.5px; margin-left: -0.75px; }
  #joystick::after  { top: 50%; left: 16px; right: 16px; height: 1.5px; margin-top: -0.75px; }

  #joyKnob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 52px;
    height: 52px;
    margin: -26px 0 0 -26px;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 30%,
                rgba(255, 255, 255, 0.96),
                rgba(244, 230, 190, 0.94) 58%,
                rgba(214, 190, 130, 0.94));
    border: 2px solid rgba(74, 58, 42, 0.52);
    box-shadow: 0 3px 8px rgba(18, 52, 62, 0.24),
                inset 0 -2px 4px rgba(160, 130, 80, 0.28);
    transition: transform 0.12s ease-out;
    will-change: transform;
  }
  #joystick.active #joyKnob { transition: none; }

  /* ---------- 右下角：情境互动按钮 ---------- */
  #actionBtn {
    position: absolute;
    right: calc(env(safe-area-inset-right, 0px) + 22px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 34px);
    width: 82px;
    height: 82px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid #4a3a2a;
    background: #8a5b3a;
    color: #fff8e6;
    box-shadow: 0 4px 0 rgba(74, 58, 42, 0.55);
    font-family: inherit;
    opacity: 0;
    transform: scale(0.82);
    pointer-events: none;
    transition: opacity 0.16s ease, transform 0.16s ease;
  }
  #actionBtn.show { opacity: 1; transform: scale(1); pointer-events: auto; }
  #actionBtn:active { transform: scale(0.94); box-shadow: 0 1px 0 rgba(74, 58, 42, 0.55); }
  #actionBtn.dim { background: #8b8175; }

  /* 鱼咬钩的那一下：按钮变亮并轻轻跳动，提示"现在点！" */
  #actionBtn.hot {
    background: #e8a33f;
    border-color: #7a4a1e;
    animation: hotPulse 0.42s ease-in-out infinite alternate;
  }
  @keyframes hotPulse {
    from { box-shadow: 0 4px 0 rgba(74, 58, 42, 0.55), 0 0 0 0 rgba(255, 216, 120, 0.7); }
    to   { box-shadow: 0 4px 0 rgba(74, 58, 42, 0.55), 0 0 0 12px rgba(255, 216, 120, 0); }
  }

  .a-icon { width: 26px; height: 26px; display: block; }
  .a-icon svg { width: 100%; height: 100%; display: block; }
  .a-label { font-size: 12px; font-weight: 700; letter-spacing: 1px; }

  /* ---------- 底部中间：制作按钮 ---------- */
  #craftOpenBtn {
    position: absolute;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 30px);
    transform: translateX(-50%);
    -webkit-appearance: none;
    appearance: none;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff8e6;
    padding: 12px 26px;
    border: 2px solid #4a3a2a;
    border-radius: 15px;
    background: #7ba85c;
    box-shadow: 0 4px 0 #4a3a2a;
    cursor: pointer;
  }
  #craftOpenBtn:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 #4a3a2a; }

  /* ---------- 钓鱼进度条 ---------- */
  #fishPanel {
    position: absolute;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 132px);
    transform: translateX(-50%) translateY(10px);
    width: min(62vw, 230px);
    padding: 10px 12px;
    background: rgba(255, 252, 240, 0.96);
    border: 2px solid #4a3a2a;
    border-radius: 14px;
    box-shadow: 0 3px 0 rgba(74, 58, 42, 0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  #fishPanel.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .fp-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #4a3a2a;
    margin-bottom: 6px;
    text-align: center;
  }

  .fp-bar {
    height: 10px;
    border: 2px solid #4a3a2a;
    border-radius: 999px;
    background: #f1e7d1;
    overflow: hidden;
  }
  #fishFill { height: 100%; width: 0%; background: #5fa9bd; }

  /* 鱼咬钩：面板变成暖色，进度条开始倒数 */
  #fishPanel.bite {
    border-color: #b8672a;
    box-shadow: 0 3px 0 rgba(184, 103, 42, 0.35);
  }
  #fishPanel.bite .fp-label { color: #b8672a; }
  #fishPanel.bite #fishFill { background: #e8a33f; }

  /* ---------- 制作菜单 ---------- */
  #craftMenu {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: rgba(20, 40, 48, 0.42);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  #craftMenu.show { opacity: 1; pointer-events: auto; }

  .sheet {
    width: 100%;
    max-width: 460px;
    max-height: 84vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
    background: #fffcf0;
    border-top: 3px solid #4a3a2a;
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -8px 24px rgba(20, 40, 48, 0.25);
    transform: translateY(18px);
    transition: transform 0.22s ease;
  }
  #craftMenu.show .sheet { transform: translateY(0); }

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .sheet-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #4a3a2a;
  }

  .sheet-close {
    -webkit-appearance: none;
    appearance: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: #8a7860;
    padding: 6px 14px;
    border: 2px solid #d8cbb2;
    border-radius: 10px;
    background: transparent;
  }

  .recipe {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    margin-bottom: 10px;
    background: #f7f0de;
    border: 2px solid #d8cbb2;
    border-radius: 14px;
  }

  .r-icon {
    width: 38px;
    height: 38px;
    flex: none;
    border-radius: 10px;
    background: #fffcf0;
    border: 2px solid #d8cbb2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .r-icon svg { width: 24px; height: 24px; display: block; }

  .r-info { flex: 1; min-width: 0; }

  .r-name {
    font-size: 15px;
    font-weight: 700;
    color: #4a3a2a;
    margin-bottom: 2px;
  }

  .r-cost { font-size: 12px; font-weight: 600; color: #8a7860; }
  .r-cost .lack { color: #c2452f; }
  .r-cost .note { color: #7ba85c; font-weight: 700; }

  .r-desc { margin-top: 2px; font-size: 11px; line-height: 1.4; color: #a8998a; }

  .r-btn {
    -webkit-appearance: none;
    appearance: none;
    font-family: inherit;
    flex: none;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff8e6;
    padding: 9px 16px;
    border: 2px solid #4a3a2a;
    border-radius: 11px;
    background: #8a5b3a;
    box-shadow: 0 3px 0 rgba(74, 58, 42, 0.5);
  }
  .r-btn:disabled {
    background: #cfc4ae;
    color: #fffcf0;
    border-color: #b3a894;
    box-shadow: 0 3px 0 rgba(74, 58, 42, 0.16);
  }
  .r-btn:not(:disabled):active { transform: translateY(3px); box-shadow: 0 0 0 rgba(74, 58, 42, 0.5); }

  /* 还没解锁的配方：整行压暗，按钮显示"未解锁" */
  .recipe.locked { background: #f1ece1; border-color: #e0d8c8; }
  .recipe.locked .r-icon { opacity: 0.45; }
  .recipe.locked .r-name { color: #a89c8a; }
  .recipe.locked .r-desc { color: #b6ab99; }

  .sheet-tip {
    margin: 4px 2px 0;
    font-size: 12px;
    line-height: 1.6;
    color: #a09280;
  }

  /* 制作面板底部的小字按钮：重新开始 */
  .sheet-reset {
    -webkit-appearance: none;
    appearance: none;
    font-family: inherit;
    display: block;
    margin: 14px auto 0;
    padding: 7px 16px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #a09280;
    background: transparent;
    border: 2px solid #e3d9c4;
    border-radius: 10px;
  }
  .sheet-reset.armed {
    color: #c2452f;
    border-color: #e0a08c;
    background: #fdeee8;
  }

  /* ---------- 游戏结束遮罩 ---------- */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(26, 40, 48, 0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 20;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }

  .panel {
    width: min(80vw, 300px);
    padding: 26px 22px 24px;
    text-align: center;
    background: #fffcf0;
    border: 3px solid #4a3a2a;
    border-radius: 22px;
    box-shadow: 0 8px 0 rgba(74, 58, 42, 0.35);
  }

  .panel .title {
    margin: 0 0 8px;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #4a3a2a;
  }

  .panel .sub {
    margin: 0 0 20px;
    font-size: 14px;
    line-height: 1.6;
    color: #8a7860;
  }

  .restart-btn {
    -webkit-appearance: none;
    appearance: none;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff8e6;
    padding: 11px 26px;
    border: 2px solid #4a3a2a;
    border-radius: 15px;
    background: #7ba85c;
    box-shadow: 0 4px 0 #4a3a2a;
  }
  .restart-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #4a3a2a; }

  /* ---------- 操作提示 ---------- */
  #hint {
    position: absolute;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
    transform: translateX(-50%);
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(74, 58, 42, 0.66);
    color: #fff8e6;
    font-size: 12px;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 0.7s ease;
  }
  #hint.hide { opacity: 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage"></canvas>

  <!-- 顶部中间：第几天 + 当前时段（白天 / 黄昏 / 夜晚） -->
  <div id="dayChip">
    <span class="d-icon" id="dayIcon"></span>
    <span id="dayNum">第 1 天</span>
    <span class="d-phase" id="dayPhaseLabel">清晨</span>
  </div>

  <!-- 左上角：资源数值 + 采集提示 -->
  <div class="hud-left">
    <div class="chip">
      <span class="dot wood"></span>
      <span>木材</span>
      <span class="num" id="woodNum">0</span>
    </div>
    <div class="chip">
      <span class="dot stone"></span>
      <span>石头</span>
      <span class="num" id="stoneNum">0</span>
    </div>
    <div class="chip">
      <span class="dot flint"></span>
      <span>燧石</span>
      <span class="num" id="flintNum">0</span>
    </div>
    <div class="chip eat" id="berryChip">
      <span class="dot berry"></span>
      <span>浆果</span>
      <span class="num" id="berryNum">0</span>
      <span class="tag">吃</span>
    </div>
    <div class="chip eat" id="shellChip">
      <span class="dot shell"></span>
      <span>贝壳</span>
      <span class="num" id="shellNum">0</span>
      <span class="tag">吃</span>
    </div>
    <div class="chip eat" id="fishChip">
      <span class="dot fish"></span>
      <span>鱼</span>
      <span class="num" id="fishNum">0</span>
      <span class="tag">吃</span>
    </div>
    <div class="chip eat" id="foodChip">
      <span class="dot food"></span>
      <span>食物</span>
      <span class="num" id="foodNum">0</span>
      <span class="tag">吃</span>
    </div>
    <div class="chip eat" id="cookedChip">
      <span class="dot cooked"></span>
      <span>熟鱼</span>
      <span class="num" id="cookedNum">0</span>
      <span class="tag">吃</span>
    </div>
    <div id="toast"></div>
  </div>

  <!-- 右上角：饥饿条 -->
  <div class="hud-right">
    <div class="hunger">
      <span class="hunger-label">饥饿</span>
      <div class="bar"><div id="hungerFill"></div></div>
    </div>
    <!-- 音效开关：默认开启，关掉后所有声音静音 -->
    <button id="soundBtn" aria-label="关闭音效">
      <svg class="ico-on" viewBox="0 0 24 24" fill="none" stroke="#4a3a2a"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5 h3.5 L12 5.5 v13 L7.5 14.5 H4 z" fill="#f7e6c4"/>
        <path d="M15.5 8.5 q2.6 3.5 0 7"/>
        <path d="M18.2 6 q4 6 0 12"/>
      </svg>
      <svg class="ico-off" viewBox="0 0 24 24" fill="none" stroke="#4a3a2a"
