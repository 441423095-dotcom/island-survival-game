  /**
   * 可复现的伪随机数（同一个种子每次得到同样的抖动）
   * 用来画"手绘感"的歪歪扭扭的线条，并且保证每一帧形状不变
   */
  function makeRandom(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** 生成一圈带抖动的圆点（相对圆心），用于画手绘风的圆 */
  function circlePts(r, jitter, rand) {
    const pts = [];
    const n = 14;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2;
      const k = 1 + (rand() * 2 - 1) * jitter;
      pts.push({ x: Math.cos(ang) * r * k, y: Math.sin(ang) * r * k * 0.95 });
    }
    return pts;
  }

  /** 用二次贝塞尔把点串成平滑的闭合曲线（手绘感的形状都靠它） */
  function smoothPath(pts, ox, oy) {
    ox = ox || 0;
    oy = oy || 0;
    const n = pts.length;
    if (n < 3) return;
    ctx.beginPath();
    const last = pts[n - 1];
    const first = pts[0];
    ctx.moveTo((last.x + first.x) / 2 + ox, (last.y + first.y) / 2 + oy);
    for (let i = 0; i < n; i++) {
      const cur = pts[i];
      const next = pts[(i + 1) % n];
      ctx.quadraticCurveTo(
        cur.x + ox, cur.y + oy,
        (cur.x + next.x) / 2 + ox, (cur.y + next.y) / 2 + oy
      );
    }
    ctx.closePath();
  }

  /** 圆角矩形路径（农田、面板都用它） */
  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  /** 平滑过渡：x 从 a 到 b 之间，返回值从 0 平滑变到 1 */
  function smoothstep(a, b, x) {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  /**
   * 一天的时段换算
   * 返回 { dark 夜色浓度 0..1, warm 日出日落的暖色 0..1 }
   * 想改"几点天亮天黑"就改这里的数字
   */
  function dayPhase(clock) {
    const c = clock;

    // 夜色：深夜最深，清晨慢慢亮，黄昏慢慢暗
    let dark;
    if (c < 0.20) dark = 1;
    else if (c < 0.34) dark = 1 - smoothstep(0.20, 0.34, c);
    else if (c < DUSK_AT) dark = 0;
    else if (c < 0.82) dark = smoothstep(DUSK_AT, 0.82, c);
    else dark = 1;

    // 暖色：日出、日落各一个峰值
    let warm = Math.max(
      1 - Math.abs(c - 0.27) / 0.11,
      1 - Math.abs(c - 0.74) / 0.11
    );
    warm = Math.max(0, Math.min(1, warm));

    return { dark: dark, warm: warm };
  }

  /** 时段的中文名字，显示在顶部 */
  function phaseName(c) {
    if (c < 0.20) return '深夜';
    if (c < 0.34) return '清晨';
    if (c < DUSK_AT) return '白天';
    if (c < 0.82) return '黄昏';
    return '夜晚';
  }

  /** 判断点是否在小岛（椭圆）内部，k 越小范围越靠里 */
  function ptInIsland(x, y, k) {
    k = k || 1;
    const isl = world.island;
    const nx = (x - isl.cx) / (isl.rx * k);
    const ny = (y - isl.cy) / (isl.ry * k);
    return nx * nx + ny * ny <= 1;
  }

  /** 判断点是否在水塘里，k 越大范围越外扩 */
  function inPond(x, y, k) {
    k = k || 1;
    const p = world.pond;
    const nx = (x - p.x) / (p.rx * k);
    const ny = (y - p.y) / (p.ry * k);
    return nx * nx + ny * ny <= 1;
  }

  /** 判断点是否在南边那片沙滩上，k 越大范围越外扩 */
  function inBeach(x, y, k) {
    k = k || 1;
    const b = world.beach;
    if (!b.rx) return false;
    const nx = (x - b.x) / (b.rx * k);
    const ny = (y - b.y) / (b.ry * k);
    return nx * nx + ny * ny <= 1;
  }

  /**
   * 判断点是否在中间那块高地上
   * 高地是走不上去的岩坡，只能绕着走——这就是地形差带来的走位变化
   */
  function inHill(x, y, k) {
    k = k || 1;
    const h = world.hill;
    if (!h.rx) return false;
    const nx = (x - h.x) / (h.rx * k);
    const ny = (y - h.y) / (h.ry * k);
    return nx * nx + ny * ny <= 1;
  }

  /** 角色能不能站在这个点上：岛内的陆地，不在水里，也不在陡坡上 */
  function isWalkable(x, y) {
    if (!ptInIsland(x, y, 0.94)) return false;
    if (inPond(x, y, 1.12)) return false;   // 水塘不能走进去，只能在岸边钓鱼
    if (inHill(x, y, 0.96)) return false;   // 高地是陡坡，走不上去
    return true;
  }

  /** 到水塘中心的"归一化距离"：1 表示正好在岸边，越大越远 */
  function pondDistance(x, y) {
    const p = world.pond;
    return Math.hypot((x - p.x) / p.rx, (y - p.y) / p.ry);
  }

  /** 角色是否站在水边（可以钓鱼） */
  function isNearPond(x, y) {
    return pondDistance(x, y) < 1.75;
  }

  /** 角色是否站在农田附近（范围收得比较紧，免得站在岛中间就弹出农田按钮） */
  function isNearFarm(x, y) {
    const f = world.farm;
    return Math.abs(x - f.x) < f.w / 2 + 14 &&
           Math.abs(y - f.y) < f.h / 2 + 14;
  }

  /** 角色是否站在篝火旁边（可以烤鱼） */
  function isNearCampfire(x, y) {
    const c = world.campfire;
    return Math.hypot(x - c.x, y - c.y) < 48;
  }

  /**
   * 采集某棵树 / 石头 / 浆果 / 贝壳需要贴着多久
   * 有对应的工具就是"一下就好"，否则要磨一会儿
   * 浆果和贝壳是徒手就能拿的，很快
   */
  function contactNeed(ent) {
    if (!ent) return CONTACT_TIME_BARE;
    if (ent.kind === 'berry' || ent.kind === 'shell') return 0.45;
    if (ent.kind === 'tree' && state.hasAxe) return CONTACT_TIME_AXE;
    if (ent.kind === 'rock' && state.hasPick) return CONTACT_TIME_AXE;
    return CONTACT_TIME_BARE;
  }

  // ==================================================================
  // 4. 世界布局（响应屏幕尺寸）
  // ==================================================================

  /** 建出树和石头的数据（重开游戏时会重建，坐标是比例值，尺寸在布局时算） */
  function buildEntities() {
    state.trees = TREE_SPOTS.map((s, i) => ({
      kind: 'tree', fx: s[0], fy: s[1],
      x: 0, y: 0, r: 0,
      alive: true,      // 是否还立着
      regrow: 0,        // 被砍掉后还剩多少秒长回来
      grow: 1,          // 长回来的弹出动画进度 0..1
      dead: (i === 3 || i === 9),   // 岛上有两棵枯树，只剩光秃秃的枝干
      canopy: null,
      seed: 1103 + i * 37
    }));
    state.rocks = ROCK_SPOTS.map((s, i) => ({
      kind: 'rock', fx: s[0], fy: s[1],
      x: 0, y: 0, r: 0,
      alive: true,
      regrow: 0,
      grow: 1,
      pts: null,
      seed: 2207 + i * 53
    }));

    // 浆果丛：丛一直都在，只是结果和不结果的区别
    state.bushes = BERRY_SPOTS.map((s, i) => ({
      kind: 'berry', fx: s[0], fy: s[1],
      x: 0, y: 0, r: 0,
      ripe: true,       // 现在有没有果子
      regrow: 0,        // 摘掉之后还要多少秒重新结果
      grow: 1,
      pts: null,
      seed: 3301 + i * 61
    }));

    // 贝壳：散在南边沙滩上，捡走之后潮水会再冲上来
    state.shells = SHELL_SPOTS.map((s, i) => ({
      kind: 'shell', fx: s[0], fy: s[1],
      x: 0, y: 0, r: 0,
      alive: true,
      regrow: 0,
      grow: 1,
      seed: 4409 + i * 29
    }));
  }

  /** 根据当前屏幕尺寸，重新算一遍小岛、水塘、农田、树、石头的位置和形状 */
  function layoutWorld() {
    const W = world.W;
    const H = world.H;
    const base = Math.min(W, H);   // 用短边做尺寸基准，竖屏横屏都不会太夸张

    // ---- 小岛：屏幕中央一块椭圆形的陆地 ----
    const isl = world.island;
    isl.cx = W * 0.5;
    isl.cy = H * 0.52;
    isl.rx = W * 0.46;
    isl.ry = H * 0.42;

    const rand1 = makeRandom(311);
    isl.blob = [];
    for (let i = 0; i < 26; i++) {
      const ang = (i / 26) * Math.PI * 2;
      const k = 1 + (rand1() * 2 - 1) * 0.035;
      isl.blob.push({
        x: isl.cx + Math.cos(ang) * isl.rx * k,
        y: isl.cy + Math.sin(ang) * isl.ry * k
      });
    }

    const rand2 = makeRandom(733);
    isl.innerBlob = [];
    for (let i = 0; i < 26; i++) {
      const ang = (i / 26) * Math.PI * 2;
      const k = 1 + (rand2() * 2 - 1) * 0.03;
      isl.innerBlob.push({
        x: isl.cx + Math.cos(ang) * isl.rx * 0.93 * k,
        y: isl.cy + Math.sin(ang) * isl.ry * 0.92 * k
      });
    }

    // ---- 水塘：岛左下方的一小片水边（钓鱼点）----
    const pond = world.pond;
    pond.x = W * 0.30;
    pond.y = H * 0.66;
    pond.rx = W * 0.16;
    pond.ry = H * 0.048;

    const rand3 = makeRandom(991);
    pond.blob = [];
    for (let i = 0; i < 20; i++) {
      const ang = (i / 20) * Math.PI * 2;
      const k = 1 + (rand3() * 2 - 1) * 0.07;
      pond.blob.push({
        x: pond.x + Math.cos(ang) * pond.rx * k,
        y: pond.y + Math.sin(ang) * pond.ry * k
      });
    }

    // ---- 南边的一片沙滩：捡贝壳的地方，地势比草地低一层 ----
    const beach = world.beach;
    beach.x = W * 0.46;
    beach.y = H * 0.845;
    beach.rx = W * 0.32;
    beach.ry = H * 0.085;

    const randB = makeRandom(1717);
    beach.blob = [];
    for (let i = 0; i < 22; i++) {
      const ang = (i / 22) * Math.PI * 2;
      const k = 1 + (randB() * 2 - 1) * 0.06;
      beach.blob.push({
        x: beach.x + Math.cos(ang) * beach.rx * k,
        y: beach.y + Math.sin(ang) * beach.ry * k * (ang > Math.PI ? 1.05 : 0.9)
      });
    }

    // ---- 中间的高地：一块走不上去的岩坡，绕过去得花点时间 ----
    const hill = world.hill;
    hill.x = W * 0.50;
    hill.y = H * 0.30;
    hill.rx = W * 0.165;
    hill.ry = H * 0.095;

    const randH = makeRandom(2020);
    hill.blob = [];
    for (let i = 0; i < 24; i++) {
      const ang = (i / 24) * Math.PI * 2;
      const k = 1 + (randH() * 2 - 1) * 0.05;
      hill.blob.push({
        x: hill.x + Math.cos(ang) * hill.rx * k,
        y: hill.y + Math.sin(ang) * hill.ry * k
      });
    }
    // 高地顶面：比底面小一圈，画出来才有"上面还有一层"的感觉
    hill.top = hill.blob.map(p => ({
      x: hill.x + (p.x - hill.x) * 0.82,
      y: hill.y + (p.y - hill.y) * 0.78 - hill.ry * 0.10
    }));

    // ---- 农田：岛右侧留出的一块平地 ----
    const farm = world.farm;
    farm.w = W * 0.30;
    farm.h = H * 0.15;
    farm.x = W * 0.70;
    farm.y = H * 0.56;

    // ---- 工作台：建好后出现在农田下方 ----
    world.bench.x = W * 0.66;
    world.bench.y = H * 0.72;

    // ---- 篝火：建好后出现在岛心偏上一点，开局走两步就能用到 ----
    world.campfire.x = W * 0.50;
    world.campfire.y = H * 0.43;

    // ---- 海面波浪：只放在小岛外面的海里 ----
    world.waves = [];
    const wrand = makeRandom(4242);
    let guard = 0;
    while (world.waves.length < 26 && guard++ < 600) {
      const fx = wrand();
      const fy = wrand();
      if (ptInIsland(fx * W, fy * H, 1.12)) continue;  // 落在岛上就丢掉
      world.waves.push({ fx: fx, fy: fy, w: 14 + wrand() * 24, p: wrand() * Math.PI * 2 });
    }

    // ---- 草地上的小草簇 ----
    world.tufts = [];
    const trand = makeRandom(777);
    let tg = 0;
    while (world.tufts.length < 26 && tg++ < 600) {
      const x = (0.1 + trand() * 0.8) * W;
      const y = (0.1 + trand() * 0.8) * H;
      if (!ptInIsland(x, y, 0.86)) continue;
      if (inPond(x, y, 1.25)) continue;
      if (inBeach(x, y, 1.02)) continue;
      if (inHill(x, y, 1.05)) continue;
      if (Math.abs(x - farm.x) < farm.w / 2 && Math.abs(y - farm.y) < farm.h / 2) continue;
      world.tufts.push({ x: x, y: y, s: 0.7 + trand() * 0.6 });
    }

    // ---- 荒芜感：枯黄的干草斑块 ----
    world.dryPatches = [];
    const drand = makeRandom(5150);
    let dg = 0;
    while (world.dryPatches.length < 7 && dg++ < 400) {
      const x = (0.14 + drand() * 0.72) * W;
      const y = (0.14 + drand() * 0.72) * H;
      if (!ptInIsland(x, y, 0.84)) continue;
      if (inPond(x, y, 1.3)) continue;
      if (inBeach(x, y, 1.05)) continue;
      if (inHill(x, y, 1.05)) continue;
      const rx = base * (0.05 + drand() * 0.05);
      const ry = rx * (0.45 + drand() * 0.25);
      const pts = circlePts(rx, 0.22, drand).map(p => ({ x: p.x, y: p.y * (ry / rx) }));
      world.dryPatches.push({ x: x, y: y, pts: pts, seed: drand() });
    }

    // ---- 荒芜感：地面上的裂缝 ----
    world.cracks = [];
    const crand = makeRandom(6600);
    let cg = 0;
    while (world.cracks.length < 5 && cg++ < 400) {
      const x = (0.16 + crand() * 0.68) * W;
      const y = (0.16 + crand() * 0.68) * H;
      if (!ptInIsland(x, y, 0.82)) continue;
      if (inPond(x, y, 1.3)) continue;
      if (inBeach(x, y, 1.05)) continue;
      if (inHill(x, y, 1.08)) continue;
      const segs = [];
      let px = x;
      let py = y;
      let ang = crand() * Math.PI * 2;
      const n = 3 + Math.floor(crand() * 3);
      for (let i = 0; i < n; i++) {
        ang += (crand() * 2 - 1) * 0.9;
        const len = base * (0.02 + crand() * 0.035);
        px += Math.cos(ang) * len;
        py += Math.sin(ang) * len;
        segs.push({ x: px, y: py });
      }
      world.cracks.push({ x: x, y: y, segs: segs });
    }

    // ---- 荒芜感：沙滩和草地上的残骸（贝壳、枯枝、碎石、白骨） ----
    world.debris = [];
    const erand = makeRandom(8080);
    let eg = 0;
    while (world.debris.length < 16 && eg++ < 500) {
      const x = (0.06 + erand() * 0.88) * W;
      const y = (0.08 + erand() * 0.84) * H;
      if (!ptInIsland(x, y, 0.97)) continue;
      if (inPond(x, y, 1.2)) continue;
      if (inHill(x, y, 1.06)) continue;
      const kindRoll = erand();
      const kind = kindRoll < 0.34 ? 'twig'
                 : kindRoll < 0.62 ? 'shell'
                 : kindRoll < 0.84 ? 'pebble'
                 : 'bone';
      world.debris.push({
        x: x, y: y,
        kind: kind,
        a: erand() * Math.PI * 2,
        s: 0.75 + erand() * 0.7
      });
    }

    // ---- 荒芜感：搁浅在沙滩上的破木筏 ----
    world.wreck.x = W * 0.23;
    world.wreck.y = H * 0.82;
    world.wreck.a = -0.42;

    // ---- 树：位置 + 半径 + 手绘树冠 ----
    state.trees.forEach(t => {
      t.x = t.fx * W;
      t.y = t.fy * H;
      t.r = Math.max(16, base * 0.058);
      const rand = makeRandom(t.seed);
      const r = t.r;
      t.canopy = [
        { ox: 0,         oy: -r * 1.05, r: r * 0.92, tone: 0 },
        { ox: -r * 0.62, oy: -r * 0.72, r: r * 0.66, tone: 0 },
        { ox:  r * 0.62, oy: -r * 0.72, r: r * 0.66, tone: 0 },
        { ox:  r * 0.08, oy: -r * 1.62, r: r * 0.56, tone: 1 }
      ].map(c => ({
        ox: c.ox, oy: c.oy, r: c.r, tone: c.tone,
        pts: circlePts(c.r, 0.07, rand)
      }));
    });

    // ---- 石头 ----
    state.rocks.forEach(rk => {
      rk.x = rk.fx * W;
      rk.y = rk.fy * H;
      rk.r = Math.max(11, base * 0.040);
      rk.pts = circlePts(rk.r, 0.2, makeRandom(rk.seed));
    });

    // ---- 浆果丛 ----
    state.bushes.forEach(b => {
      b.x = b.fx * W;
      b.y = b.fy * H;
      b.r = Math.max(13, base * 0.045);
      b.pts = circlePts(b.r, 0.16, makeRandom(b.seed));
    });

    // ---- 贝壳 ----
    state.shells.forEach(s => {
      s.x = s.fx * W;
      s.y = s.fy * H;
      s.r = Math.max(7, base * 0.020);
    });

    // ---- 燧石堆的大小 ----
    state.rare.r = Math.max(12, base * 0.044);
  }

  /** 画布跟着窗口尺寸变化：按 devicePixelRatio 放大，保证手机上清晰 */
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const nw = wrap.clientWidth || window.innerWidth;
    const nh = wrap.clientHeight || window.innerHeight;

    // 尺寸变化前算好比例，随后让角色位置跟着缩放，避免突然跑到海里
    const sx = world.W ? nw / world.W : 1;
    const sy = world.H ? nh / world.H : 1;

    world.W = nw;
    world.H = nh;

    canvas.width = Math.round(nw * dpr);
    canvas.height = Math.round(nh * dpr);
    canvas.style.width = nw + 'px';
    canvas.style.height = nh + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    layoutWorld();

    const p = state.player;
    p.x *= sx;
    p.y *= sy;
  }

  // ==================================================================
  // 5. 绘制
  // ==================================================================

  /** 大海：整屏底色 + 缓慢漂移的手绘波浪线 */
  function drawSea(t) {
    ctx.fillStyle = SEA;
    ctx.fillRect(0, 0, world.W, world.H);

    ctx.strokeStyle = SEA_LINE;
    ctx.lineWidth = 2;
    world.waves.forEach(w => {
      const x = w.fx * world.W + Math.sin(t * 0.6 + w.p) * 7;
      const y = w.fy * world.H;
      ctx.beginPath();
      ctx.moveTo(x - w.w / 2, y);
      ctx.quadraticCurveTo(x, y - 5, x + w.w / 2, y);
      ctx.stroke();
    });
  }

  /** 小岛：沙滩 + 草地 + 干草斑块 + 裂缝 + 残骸，整体要有点荒废的味道 */
  function drawIsland() {
    const isl = world.island;

    ctx.fillStyle = SAND;
    smoothPath(isl.blob);
    ctx.fill();
    ctx.strokeStyle = SAND_EDGE;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.fillStyle = GRASS;
    smoothPath(isl.innerBlob);
    ctx.fill();
    ctx.strokeStyle = GRASS_EDGE;
    ctx.lineWidth = 2;
    ctx.stroke();

    // 南边的沙滩（画在草地上，边缘只到草地为止，不会漏进海里）
    drawBeach();

    // 中间的高地
    drawHill();

    // 枯黄的干草斑块：让草地看起来一块一块地干掉了
    for (const dp of world.dryPatches) {
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = DRY_GRASS;
      smoothPath(dp.pts, dp.x, dp.y);
      ctx.fill();
      ctx.restore();
    }

    // 草丛点缀：几笔简单的 "v" 形小线
    ctx.strokeStyle = GRASS_EDGE;
    ctx.lineWidth = 2;
    for (const tf of world.tufts) {
      const s = 4 * tf.s;
      ctx.beginPath();
      ctx.moveTo(tf.x - s, tf.y - s * 0.7);
      ctx.lineTo(tf.x - s * 0.4, tf.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(tf.x + s * 0.3, tf.y - s);
      ctx.lineTo(tf.x + s * 0.6, tf.y);
      ctx.stroke();
    }

    // 地面裂缝
    ctx.strokeStyle = 'rgba(120,104,74,0.42)';
    ctx.lineWidth = 1.8;
    for (const ck of world.cracks) {
      ctx.beginPath();
      ctx.moveTo(ck.x, ck.y);
      for (const s of ck.segs) ctx.lineTo(s.x, s.y);
      ctx.stroke();
    }

    // 散落的残骸
    for (const d of world.debris) drawDebris(d);

    // 搁浅的破木筏
    drawWreck();
  }

  /**
   * 南边的沙滩：比草地低一层
   * 靠草地的一侧画一道暗边（土坎的投影），靠海的一侧画一条浅水线，
   * 这样一眼就能看出这块地是"下去一层"的
   */
  function drawBeach() {
    const b = world.beach;
    if (!b.rx) return;

    ctx.save();
    // 只在草地范围内画沙，沙子才不会溢出岛外
    smoothPath(world.island.innerBlob);
    ctx.clip();

    // 土坎投在沙上的影子：把沙的形状往上错一点，先画一层暗色
    ctx.fillStyle = 'rgba(96,92,60,0.20)';
    smoothPath(b.blob, 0, -5);
    ctx.fill();

    // 沙面
    ctx.fillStyle = '#efe2bd';
    smoothPath(b.blob);
    ctx.fill();
    ctx.strokeStyle = '#d3bd90';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 靠近海那半边是湿沙，颜色深一点
    ctx.fillStyle = 'rgba(206,186,142,0.55)';
    smoothPath(b.blob, 0, b.ry * 0.42);
    ctx.fill();

    // 潮水线：几条很浅的白弧
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const y = b.y + b.ry * (0.30 + i * 0.22);
      ctx.beginPath();
      ctx.moveTo(b.x - b.rx * (0.72 - i * 0.16), y);
      ctx.quadraticCurveTo(b.x, y - 5, b.x + b.rx * (0.72 - i * 0.16), y);
      ctx.stroke();
    }

    // 沙里的小碎点，别让沙面太空
    const rand = makeRandom(9001);
    ctx.fillStyle = 'rgba(190,168,124,0.55)';
    for (let i = 0; i < 40; i++) {
      const ang = rand() * Math.PI * 2;
      const rr = Math.sqrt(rand()) * 0.9;
      const x = b.x + Math.cos(ang) * b.rx * rr;
      const y = b.y + Math.sin(ang) * b.ry * rr;
      ctx.beginPath();
      ctx.arc(x, y, 1 + rand() * 1.2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  /**
   * 中间的高地：一块隆起的岩坡
   * 画法是"投影 + 坡壁 + 亮一点的顶面 + 坡壁上的竖纹"，
   * 俯视角下这几层叠起来就有了高低差的感觉
   */
  function drawHill() {
    const h = world.hill;
    if (!h.rx) return;

    // 投在草地上的影子（往右下偏一点）
    ctx.fillStyle = 'rgba(58,70,44,0.20)';
    smoothPath(h.blob, h.rx * 0.05, h.ry * 0.22);
    ctx.fill();

    // 坡壁：整体偏土黄，和草地拉开色差
    ctx.fillStyle = '#a9a075';
    smoothPath(h.blob);
    ctx.fill();
    ctx.strokeStyle = '#847a52';
    ctx.lineWidth = 2.4;
    ctx.stroke();

    // 坡壁上的竖纹，暗示这是一面陡坡
    ctx.strokeStyle = 'rgba(120,108,70,0.45)';
    ctx.lineWidth = 1.8;
    for (let i = 0; i < 9; i++) {
      const ang = Math.PI * (0.10 + i * 0.10);     // 只画朝下那一半
      const x1 = h.x + Math.cos(ang) * h.rx * 0.94;
      const y1 = h.y + Math.sin(ang) * h.ry * 0.94;
      const x2 = h.x + Math.cos(ang) * h.rx * 0.72;
      const y2 = h.y + Math.sin(ang) * h.ry * 0.60;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    // 顶面：亮一层，像是被太阳照到的平台
    ctx.fillStyle = '#c3ce94';
    smoothPath(h.top);
    ctx.fill();
    ctx.strokeStyle = '#96a168';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 顶面上几块石头和一小片枯草，别让它像一块平板
    const rand = makeRandom(4545);
    ctx.fillStyle = 'rgba(150,158,120,0.55)';
    for (let i = 0; i < 5; i++) {
      const ang = rand() * Math.PI * 2;
      const rr = Math.sqrt(rand()) * 0.7;
      const x = h.x + Math.cos(ang) * h.rx * 0.70 * rr;
      const y = h.y + Math.sin(ang) * h.ry * 0.66 * rr - h.ry * 0.10;
      ctx.beginPath();
      ctx.ellipse(x, y, 4 + rand() * 4, 3 + rand() * 3, rand(), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /** 一小块残骸：枯枝 / 贝壳 / 碎石 / 白骨，都是几笔简笔画 */
  function drawDebris(d) {
    const s = d.s;

    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.a);

    if (d.kind === 'twig') {
      // 枯枝：一根断掉的小枝，带着两个岔
      ctx.strokeStyle = '#9c7a52';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-6 * s, 2 * s);
      ctx.lineTo(6 * s, -2 * s);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(3 * s, -5 * s);
      ctx.stroke();

    } else if (d.kind === 'shell') {
      // 贝壳：半个小扇形
      ctx.fillStyle = '#f3e6cf';
      ctx.strokeStyle = '#c9b28a';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(0, 0, 4 * s, Math.PI, Math.PI * 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

    } else if (d.kind === 'pebble') {
      // 小碎石
      ctx.fillStyle = '#bdb8ac';
      ctx.strokeStyle = '#8d887d';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(0, 0, 3.4 * s, 2.4 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

    } else {
      // 白骨：一根小骨头，两头圆
      ctx.fillStyle = '#efe9da';
      ctx.strokeStyle = '#c4b9a0';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(-4 * s, 0, 1.8 * s, 0, Math.PI * 2);
      ctx.arc(4 * s, 0, 1.8 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = '#efe9da';
      ctx.lineWidth = 2.6 * s;
      ctx.beginPath();
      ctx.moveTo(-4 * s, 0);
      ctx.lineTo(4 * s, 0);
      ctx.stroke();
    }

    ctx.restore();
  }

  /** 搁浅的破木筏：几块散开的木板 + 一根歪掉的桅杆 */
  function drawWreck() {
    const w = world.wreck;

    ctx.save();
    ctx.translate(w.x, w.y);
    ctx.rotate(w.a);

    // 影子
    ctx.fillStyle = 'rgba(60,80,60,0.16)';
    ctx.beginPath();
    ctx.ellipse(0, 6, 26, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // 三块散开的木板
    const planks = [
      { x: -14, y: 0, w: 20, h: 5, a: -0.06 },
      { x: 4, y: 3, w: 22, h: 5, a: 0.10 },
      { x: 10, y: -5, w: 16, h: 4.5, a: -0.22 }
    ];
    for (const p of planks) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.a);
      ctx.fillStyle = '#b08a5e';
      roundRectPath(-p.w / 2, -p.h / 2, p.w, p.h, 1.6);
      ctx.fill();
      ctx.strokeStyle = '#8a6a4a';
      ctx.lineWidth = 1.4;
      ctx.stroke();
      // 木纹
      ctx.strokeStyle = 'rgba(138,106,74,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-p.w / 2 + 3, 0);
      ctx.lineTo(p.w / 2 - 3, 0);
      ctx.stroke();
      ctx.restore();
    }

    // 断掉的桅杆，斜插在沙里
    ctx.strokeStyle = '#9c7a52';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-6, 2);
    ctx.lineTo(-12, -20);
    ctx.stroke();

    // 一小块残破的帆布
    ctx.fillStyle = 'rgba(238,230,210,0.85)';
    ctx.strokeStyle = 'rgba(180,168,140,0.9)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-12, -19);
    ctx.lineTo(0, -14);
    ctx.lineTo(-3, -6);
    ctx.lineTo(-13, -9);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  /** 水塘：一小片水边，带轻微的水纹动画 */
  function drawPond(t) {
    const p = world.pond;

    ctx.fillStyle = WATER;
    smoothPath(p.blob);
    ctx.fill();
    ctx.strokeStyle = WATER_EDGE;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.62)';
    ctx.lineWidth = 1.6;
    for (let i = 0; i < 3; i++) {
      const k = 0.55 - i * 0.14;
      const rx = p.rx * k * (1 + Math.sin(t * 1.2 + i) * 0.05);
      const ry = p.ry * k;
      const px = p.x + Math.sin(t * 0.7 + i * 1.7) * 3;
      ctx.beginPath();
      ctx.ellipse(px, p.y + 1, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 站在水边时，水面亮一圈，提示这里可以钓鱼
    const pl = state.player;
    if (!state.gameOver && !state.fishing.active && isNearPond(pl.x, pl.y)) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 + Math.sin(t * 3) * 0.2) + ')';
      ctx.lineWidth = 3;
      smoothPath(p.blob);
      ctx.stroke();
      ctx.restore();
    }
  }

  /** 农田：未建造时是一块虚线空地，建好后是翻耕过的土地 */
  function drawFarm(t) {
    const f = world.farm;
    const x = f.x - f.w / 2;
    const y = f.y - f.h / 2;
    const farm = state.farm;

    // ---- 还没建：虚线的空地 ----
    if (!farm.built) {
      ctx.save();
      ctx.setLineDash([8, 7]);
      ctx.lineDashOffset = -t * 8;
      ctx.strokeStyle = 'rgba(74,58,42,0.42)';
      ctx.lineWidth = 2.5;
      roundRectPath(x, y, f.w, f.h, 12);
      ctx.stroke();
      ctx.restore();

      // 四角木桩
      ctx.fillStyle = '#b98a5a';
      ctx.strokeStyle = 'rgba(74,58,42,0.5)';
      ctx.lineWidth = 1.6;
      [[x + 6, y + 6], [x + f.w - 6, y + 6],
       [x + 6, y + f.h - 6], [x + f.w - 6, y + f.h - 6]].forEach(c => {
        ctx.beginPath();
        ctx.arc(c[0], c[1], 3.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });

      ctx.fillStyle = 'rgba(74,58,42,0.45)';
      ctx.font = 'bold 13px ' + FONT;
      ctx.fillText('空地', f.x, f.y);
      return;
    }

    // ---- 已建好：翻耕过的土地 ----
    ctx.fillStyle = '#c8a377';
    roundRectPath(x, y, f.w, f.h, 12);
    ctx.fill();
    ctx.strokeStyle = '#8a6a4a';
    ctx.lineWidth = 3;
    ctx.stroke();

    // 田垄
    ctx.strokeStyle = 'rgba(138,106,74,0.55)';
    ctx.lineWidth = 2;
    for (let i = 1; i < 5; i++) {
      const fx = x + (f.w / 5) * i;
      ctx.beginPath();
      ctx.moveTo(fx, y + 5);
      ctx.lineTo(fx, y + f.h - 5);
      ctx.stroke();
    }

    // ---- 作物：3 列 × 2 行 ----
    if (farm.planted) {
      for (let r = 0; r < 2; r++) {
        for (let c = 0; c < 3; c++) {
          const cx = x + f.w * (0.22 + c * 0.28);
          const cy = y + f.h * (0.36 + r * 0.34);
          drawCrop(cx, cy, farm.growth, farm.ready);
        }
      }
    }

    // ---- 成熟提示：上面跳一个小箭头 ----
    if (farm.ready) {
      const ay = y - 12 + Math.sin(t * 4) * 3;
      ctx.fillStyle = '#4a3a2a';
      ctx.beginPath();
      ctx.moveTo(f.x, ay + 7);
      ctx.lineTo(f.x - 7, ay - 3);
      ctx.lineTo(f.x + 7, ay - 3);
      ctx.closePath();
      ctx.fill();
    }
  }

  /** 一株作物：茎 + 两片叶，成熟后加一颗金色穗子 */
  function drawCrop(cx, cy, growth, ready) {
    const s = 0.35 + Math.min(1, growth) * 0.75;
    const hgt = 17 * s;
    const lw = 7 * s;

    ctx.strokeStyle = ready ? '#b98a2a' : '#4f8a3d';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx, cy - hgt);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, cy - hgt * 0.5);
    ctx.quadraticCurveTo(cx - lw, cy - hgt * 0.75, cx - lw * 0.4, cy - hgt * 0.95);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, cy - hgt * 0.72);
    ctx.quadraticCurveTo(cx + lw, cy - hgt * 0.92, cx + lw * 0.4, cy - hgt * 1.1);
    ctx.stroke();

    if (ready) {
      ctx.fillStyle = '#e8b23f';
      ctx.beginPath();
      ctx.ellipse(cx, cy - hgt - 3, 4, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#b98a2a';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  /** 篝火：一圈石头 + 交叉的木柴 + 跳动的火苗 */
  function drawCampfire() {
    const x = world.campfire.x;
    const y = world.campfire.y;
    const t = state.time;

    ctx.fillStyle = SHADOW;
    ctx.beginPath();
    ctx.ellipse(x, y + 1, 24, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // 围一圈石头
    ctx.fillStyle = '#c9c9c0';
    ctx.strokeStyle = '#7d7d74';
    ctx.lineWidth = 1.6;
    for (let i = 0; i < 7; i++) {
      const ang = (i / 7) * Math.PI * 2 + 0.4;
      const sx = x + Math.cos(ang) * 17;
      const sy = y + Math.sin(ang) * 7;
      ctx.beginPath();
      ctx.ellipse(sx, sy, 4.2, 3.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    // 交叉的木柴
    ctx.strokeStyle = '#8a6a4a';
    ctx.lineWidth = 3.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 9, y + 2);
    ctx.lineTo(x + 9, y - 5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 9, y + 2);
    ctx.lineTo(x - 9, y - 5);
    ctx.stroke();

    // 火苗：两层跳动的水滴形
    const flick = Math.sin(t * 9) * 0.14 + Math.sin(t * 15.7) * 0.07;
    const h1 = 20 * (1 + flick);
    const h2 = 12 * (1 + flick * 1.4);

    ctx.fillStyle = 'rgba(240,140,60,0.95)';
    ctx.beginPath();
    ctx.moveTo(x, y - 6 - h1);
    ctx.quadraticCurveTo(x + 9, y - 12, x, y - 2);
    ctx.quadraticCurveTo(x - 9, y - 12, x, y - 6 - h1);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,214,110,0.98)';
    ctx.beginPath();
    ctx.moveTo(x, y - 6 - h2);
    ctx.quadraticCurveTo(x + 5.5, y - 11, x, y - 3);
    ctx.quadraticCurveTo(x - 5.5, y - 11, x, y - 6 - h2);
    ctx.fill();
  }

  /** 工作台：两条腿 + 一块台面 + 台面上的工具 */
  function drawBench() {
    const x = world.bench.x;
    const y = world.bench.y;

    ctx.fillStyle = SHADOW;
    ctx.beginPath();
    ctx.ellipse(x, y + 1, 22, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // 桌腿
    ctx.strokeStyle = '#8a6a4a';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 14, y);
    ctx.lineTo(x - 11, y - 18);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 14, y);
    ctx.lineTo(x + 11, y - 18);
    ctx.stroke();

    // 台面
    ctx.fillStyle = '#c8a377';
    roundRectPath(x - 21, y - 25, 42, 9, 3);
    ctx.fill();
    ctx.strokeStyle = '#4a3a2a';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 台面上的锯子
    ctx.strokeStyle = '#7d7d74';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - 9, y - 27);
    ctx.lineTo(x + 9, y - 27);
    ctx.stroke();
  }

  /** 树：影子 + 树干 + 手绘树冠；被砍掉时只剩树桩 */
  function drawTree(ent) {
    // 砍掉的树留一个树桩，等它自己长回来
    if (!ent.alive) {
      drawStump(ent);
      return;
    }

    const x = ent.x;
    const y = ent.y;
    const r = ent.r;
    const g = ent.grow == null ? 1 : ent.grow;   // 刚长回来时从小变大

    ctx.fillStyle = SHADOW;
    ctx.beginPath();
    ctx.ellipse(x, y + 1, r * 0.8 * g, r * 0.3 * g, 0, 0, Math.PI * 2);
    ctx.fill();

    // 以树根为原点缩放，长回来时就像"冒出来"
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(g, g);
    ctx.translate(-x, -y);

    // 树干：两条手绘竖线
    ctx.strokeStyle = ent.dead ? '#8e7458' : '#a9784c';
    ctx.lineWidth = Math.max(3, r * 0.17);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - r * 0.09, y);
    ctx.lineTo(x - r * 0.13, y - r * 0.95);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + r * 0.09, y);
    ctx.lineTo(x + r * 0.13, y - r * 0.95);
    ctx.stroke();

    // 枯树：没有树冠，只有几根光秃秃的枝干
    if (ent.dead) {
      ctx.strokeStyle = '#8e7458';
      ctx.lineWidth = Math.max(2, r * 0.11);
      const branches = [
        [-0.11, -0.95, -0.62, -1.55],
        [ 0.11, -0.95,  0.66, -1.42],
        [-0.10, -1.30, -0.40, -1.90],
        [ 0.10, -1.25,  0.34, -1.78],
        [ 0.00, -1.55,  0.05, -2.05]
      ];
      for (const b of branches) {
        ctx.beginPath();
        ctx.moveTo(x + b[0] * r, y + b[1] * r);
        ctx.lineTo(x + b[2] * r, y + b[3] * r);
        ctx.stroke();
      }
      ctx.restore();
      return;
    }

    // 树冠：几个手绘圆叠在一起
    for (const c of ent.canopy) {
      ctx.fillStyle = c.tone === 0 ? '#6fae5a' : '#95cf74';
      smoothPath(c.pts, x + c.ox, y + c.oy);
      ctx.fill();
      if (c.tone === 0) {
        ctx.strokeStyle = '#3f6f38';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  /** 树桩：砍完之后留在原地，快长回来时会冒出一株小绿芽 */
  function drawStump(ent) {
    const x = ent.x;
    const y = ent.y;
    const r = ent.r;
    const k = ent.regrow > 0
      ? Math.max(0, Math.min(1, 1 - ent.regrow / REGROW_TREE))
      : 1;

    ctx.fillStyle = SHADOW;
    ctx.beginPath();
    ctx.ellipse(x, y + 1, r * 0.5, r * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();

    // 树桩本体 + 断面
    ctx.fillStyle = '#b98a5a';
    ctx.strokeStyle = '#8a6a4a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(x, y - r * 0.16, r * 0.34, r * 0.30, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 年轮
    ctx.strokeStyle = 'rgba(138,106,74,0.75)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.ellipse(x, y - r * 0.18, r * 0.16, r * 0.13, 0, 0, Math.PI * 2);
    ctx.stroke();

    // 快长回来时冒一株小芽，暗示"这里还会长树"
    if (k > 0.45) {
      const s = (k - 0.45) / 0.55;
      const by = y - r * 0.30;
      ctx.strokeStyle = '#6fae5a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, by);
      ctx.lineTo(x, by - 9 * s);
      ctx.stroke();
      ctx.fillStyle = '#95cf74';
      ctx.beginPath();
      ctx.ellipse(x - 3.6 * s, by - 7 * s, 3.4 * s, 2.3 * s, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + 3.6 * s, by - 9 * s, 3.4 * s, 2.3 * s, 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /** 石头：影子 + 手绘多边形 + 一道高光；挖掉后剩几块碎石 */
  function drawRock(ent) {
    if (!ent.alive) {
      drawRubble(ent);
      return;
    }

    const x = ent.x;
    const y = ent.y;
    const r = ent.r;
    const g = ent.grow == null ? 1 : ent.grow;

    ctx.fillStyle = SHADOW;
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.35, r * 1.05 * g, r * 0.4 * g, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(g, g);
    ctx.translate(-x, -y);

    ctx.fillStyle = '#c9c9c0';
    smoothPath(ent.pts, x, y - r * 0.5);
    ctx.fill();
    ctx.strokeStyle = '#7d7d74';
    ctx.lineWidth = 2.4;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.75)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - r * 0.36, y - r * 0.92);
    ctx.lineTo(x + r * 0.04, y - r * 1.12);
    ctx.stroke();

    ctx.restore();
  }

  /** 碎石：石头被挖走后留下的小碎块 */
  function drawRubble(ent) {
    const x = ent.x;
    const y = ent.y;
    const r = ent.r;

    ctx.fillStyle = SHADOW;
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.2, r * 0.8, r * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();

    const bits = [
      [-r * 0.45, -r * 0.10, r * 0.26],
      [ r * 0.34, -r * 0.02, r * 0.22],
      [ r * 0.02, -r * 0.30, r * 0.17]
    ];

    ctx.fillStyle = '#c9c9c0';
    ctx.strokeStyle = '#7d7d74';
    ctx.lineWidth = 1.6;
    for (const b of bits) {
      ctx.beginPath();
      ctx.ellipse(x + b[0], y + b[1], b[2], b[2] * 0.75, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }

  /**
   * 浆果丛：一小丛深绿的灌木，结果的时候上面挂着几颗红果子
   * 摘完之后丛还在，只是没果子，过一阵子会重新结果
   */
  function drawBush(ent) {
    const x = ent.x;
    const y = ent.y;
    const r = ent.r;

    // 影子
    ctx.fillStyle = SHADOW;
    ctx.beginPath();
    ctx.ellipse(x, y + 1, r * 0.85, r * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();

    // 灌木本体：几个深绿的小圆叠在一起
    ctx.fillStyle = '#5f8f4a';
    smoothPath(ent.pts, x, y - r * 0.55);
    ctx.fill();
    ctx.strokeStyle = '#3f6b34';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 上面的小枝
    ctx.strokeStyle = '#3f6b34';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(x - r * 0.1, y - r * 0.55);
    ctx.lineTo(x - r * 0.35, y - r * 1.05);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + r * 0.12, y - r * 0.55);
    ctx.lineTo(x + r * 0.38, y - r * 0.98);
    ctx.stroke();

    // 有果子的时候挂三颗红浆果
    if (ent.ripe) {
      const berries = [
        [-0.30, -0.95],
        [ 0.10, -1.12],
        [ 0.38, -0.90]
      ];
      for (const b of berries) {
        const bx = x + b[0] * r;
        const by = y + b[1] * r;
        ctx.fillStyle = '#c2452f';
        ctx.beginPath();
        ctx.arc(bx, by, r * 0.17, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#8f2f20';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        // 小高光
        ctx.fillStyle = 'rgba(255,220,210,0.85)';
        ctx.beginPath();
        ctx.arc(bx - r * 0.05, by - r * 0.05, r * 0.05, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  /** 沙滩上的贝壳：一个带放射纹的扇形，很小，但一眼能认出来 */
  function drawShell(ent) {
    const x = ent.x;
    const y = ent.y;
    const r = ent.r;
    const g = ent.grow == null ? 1 : ent.grow;
    const rr = r * g;

    // 沙上的一点影子
    ctx.fillStyle = 'rgba(120,104,70,0.18)';
    ctx.beginPath();
    ctx.ellipse(x, y + rr * 0.45, rr * 1.05, rr * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    // 贝壳本体（半圆扇面）
    ctx.fillStyle = '#f6e8d2';
    ctx.strokeStyle = '#c9ab84';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(x, y, rr, Math.PI * 1.06, Math.PI * 1.94);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 放射纹
    ctx.strokeStyle = 'rgba(201,171,132,0.85)';
    ctx.lineWidth = 1;
    for (let i = -2; i <= 2; i++) {
      const ang = Math.PI * 1.5 + i * 0.30;
      ctx.beginPath();
      ctx.moveTo(x, y - rr * 0.15);
      ctx.lineTo(x + Math.cos(ang) * rr * 0.92, y + Math.sin(ang) * rr * 0.92);
      ctx.stroke();
    }
  }

  /**
   * 稀有的燧石堆：深色石头里嵌着橙色的燧石，表面一闪一闪
   * 只偶尔在岛上冒出来一处，采完就没了
   */
  function drawRare() {
    const r = state.rare;
    if (!r.active) return;

    const t = state.time;
    const g = r.appear;              // 出现时的放大动画
    const x = r.x;
    const y = r.y;
    const rad = r.r * g;

    // 快消失时整体变淡，提醒玩家要没了
    const fading = r.life < 6 ? Math.max(0.25, r.life / 6) : 1;

    ctx.save();
    ctx.globalAlpha = fading;

    // 地面上一圈淡淡的暖光，远处也能注意到
    const glow = ctx.createRadialGradient(x, y, 2, x, y, rad * 2.6);
    const pulse = 0.16 + Math.sin(t * 2.6) * 0.06;
    glow.addColorStop(0, 'rgba(255,170,80,' + pulse.toFixed(3) + ')');
    glow.addColorStop(1, 'rgba(255,170,80,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, rad * 2.6, 0, Math.PI * 2);
    ctx.fill();

    // 影子
    ctx.fillStyle = 'rgba(60,70,60,0.18)';
    ctx.beginPath();
    ctx.ellipse(x, y + rad * 0.3, rad * 1.1, rad * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();

    // 石头本体：比普通石头深，像是被烧过
    ctx.fillStyle = '#6b625a';
    ctx.strokeStyle = '#413a34';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.ellipse(x, y - rad * 0.45, rad * 0.95, rad * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 嵌在里面的燧石：几块橙黄的小尖角，会闪
    const sparkle = 0.65 + Math.sin(t * 5) * 0.35;
    ctx.fillStyle = '#f0a24a';
    ctx.strokeStyle = '#c47a2a';
    ctx.lineWidth = 1.2;
    const chips = [
      [-0.34, -0.62, 0.30],
      [ 0.24, -0.72, 0.26],
      [ 0.02, -0.30, 0.22],
      [-0.10, -0.92, 0.20]
    ];
    for (const c of chips) {
      ctx.beginPath();
      ctx.moveTo(x + c[0] * rad, y + c[1] * rad - c[2] * rad);
      ctx.lineTo(x + (c[0] + c[2]) * rad, y + (c[1] + c[2] * 0.5) * rad);
      ctx.lineTo(x + (c[0] - c[2] * 0.4) * rad, y + (c[1] + c[2]) * rad);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    // 闪烁的小亮点
    ctx.globalAlpha = fading * sparkle;
    ctx.fillStyle = '#fff2c8';
    ctx.beginPath();
    ctx.arc(x + rad * 0.05, y - rad * 0.70, rad * 0.16, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  /** 角色：影子 + 腿 + 身体 + 头 + 眼睛，走动时上下起伏、左右翻转 */
  function drawPlayer() {
    const p = state.player;
    const x = p.x;
    const y = p.y;
    const bob = p.moving ? Math.sin(p.bob) * 1.8 : 0;
    const swing = p.moving ? Math.sin(p.bob) * 4 : 0;

    ctx.fillStyle = 'rgba(40,60,30,0.2)';
    ctx.beginPath();
    ctx.ellipse(x, y + 1, 11, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // 腿
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 3.5, y - 8);
    ctx.lineTo(x - 3.5 + swing, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 3.5, y - 8);
    ctx.lineTo(x + 3.5 - swing, y);
    ctx.stroke();

    // 身体
    ctx.fillStyle = '#e8814f';
    ctx.beginPath();
    ctx.ellipse(x, y - 15 + bob, 7.5, 8.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#b25f36';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // 头
    const hy = y - 28 + bob;
    ctx.fillStyle = '#f7cba4';
    ctx.beginPath();
    ctx.arc(x, hy, 7.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // 头发
    ctx.fillStyle = '#5b4636';
    ctx.beginPath();
    ctx.ellipse(x, hy - 5.4, 7.2, 4.2, 0, Math.PI, Math.PI * 2);
    ctx.fill();

    // 眼睛（朝着走的方向偏一点，配合左右翻转）
    ctx.fillStyle = INK;
    const ex = p.facing * 1.2;
    ctx.beginPath();
    ctx.arc(x - 2.6 + ex, hy - 0.4, 1.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + 2.6 + ex, hy - 0.4, 1.15, 0, Math.PI * 2);
    ctx.fill();

    // 做好石斧后，角色手边就多一把小斧头
    if (state.hasAxe) {
      drawAxe(x + 11 * p.facing, y - 18 + bob, 0.85, p.facing * 0.3, p.facing);
    }

    // 有火把时，天黑了会亮起来
    if (state.hasTorch && dayPhase(state.clock).dark > 0.25) {
      drawTorch(x - 11 * p.facing, y - 22 + bob, state.time);
    }
  }

  /** 角色手里的火把：一根木柄 + 一点跳动的火苗 */
  function drawTorch(cx, cy, t) {
    const flick = Math.sin(t * 11) * 0.18 + Math.sin(t * 19) * 0.08;

    ctx.strokeStyle = '#8a6a4a';
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy + 9);
    ctx.lineTo(cx, cy - 5);
    ctx.stroke();

    const h = 8 * (1 + flick);
    ctx.fillStyle = 'rgba(240,150,60,0.95)';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 5 - h);
    ctx.quadraticCurveTo(cx + 4.5, cy - 7, cx, cy - 3);
    ctx.quadraticCurveTo(cx - 4.5, cy - 7, cx, cy - 5 - h);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,224,130,0.98)';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 5 - h * 0.6);
    ctx.quadraticCurveTo(cx + 2.4, cy - 6.5, cx, cy - 3.5);
    ctx.quadraticCurveTo(cx - 2.4, cy - 6.5, cx, cy - 5 - h * 0.6);
    ctx.fill();
  }

  /** 小斧头图标（石斧） */
  function drawAxe(cx, cy, scale, angle, facing) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.scale(scale * facing, scale);

    // 木柄
    ctx.strokeStyle = '#a9784c';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 12);
    ctx.lineTo(0, -10);
    ctx.stroke();

    // 石斧头
    ctx.fillStyle = '#c9c9c0';
    ctx.beginPath();
    ctx.moveTo(-3, -11);
    ctx.lineTo(8, -14);
    ctx.lineTo(10, -4);
    ctx.lineTo(-3, -2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#75756c';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();
  }

  /** 贴着资源采集时，角色头顶画一圈进度环 */
  function drawContactProgress() {
    const c = state.contact;
    if (!c.target) return;
    // 浆果丛看"有没有果子"，其它资源看"还在不在"
    if (c.target.kind === 'berry' ? !c.target.ripe : !c.target.alive) return;

    const need = contactNeed(c.target);
    const k = Math.min(1, c.t / need);
    const p = state.player;
    const cx = p.x;
    const cy = p.y - 44;

    ctx.save();
    ctx.strokeStyle = 'rgba(74,58,42,0.28)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, 9, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = '#e8b23f';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, 9, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k);
    ctx.stroke();
    ctx.restore();
  }

  /** 钓鱼：钓竿 + 鱼线 + 浮漂；鱼咬钩时浮漂沉下去并收紧一圈倒计时环 */
  function drawFishingLine(t) {
    const f = state.fishing;
    if (!f.active) return;

    const p = state.player;
    const pond = world.pond;
    const dx = p.x - pond.x;
    const dy = p.y - pond.y;
    const len = Math.hypot(dx, dy) || 1;

    const biting = f.phase === 'bite';

    // 浮漂落在水塘里靠近角色的一侧：等待时轻轻浮动，咬钩时猛地往下沉
    const bx = pond.x + (dx / len) * pond.rx * 0.5;
    let by = pond.y + (dy / len) * pond.ry * 0.5 + Math.sin(t * 3) * 1.5;
    if (biting) by += 7 + Math.sin(t * 34) * 1.8;

    const rodX = p.x + p.facing * 10;
    const rodY = p.y - 34;

    // 钓竿
    ctx.strokeStyle = '#8a6a4a';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - 20);
    ctx.lineTo(rodX, rodY);
    ctx.stroke();

    // 鱼线：咬钩时绷紧一点
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(rodX, rodY);
    ctx.quadraticCurveTo((rodX + bx) / 2, rodY - (biting ? 8 : 16), bx, by);
    ctx.stroke();

    // 浮漂
    ctx.fillStyle = '#fffcf0';
    ctx.beginPath();
    ctx.arc(bx, by, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e05c4a';
    ctx.beginPath();
    ctx.arc(bx, by - 1.5, 2.6, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(74,58,42,0.7)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(bx, by, 4, 0, Math.PI * 2);
    ctx.stroke();

    if (biting) {
      // 咬钩：一圈从大到小收紧的白环，收完鱼就跑了
      const k = Math.max(0, 1 - f.t / f.window);
      const rr = 10 + 30 * k;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 + 0.55 * k).toFixed(2) + ')';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.ellipse(bx, by + 1, rr, rr * 0.42, 0, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      // 等待时：水面慢慢扩散的水纹
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 1.4;
      const rr = 6 + (t * 12) % 12;
      ctx.beginPath();
      ctx.ellipse(bx, by + 1, rr, rr * 0.42, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  /** 采集 / 收获时飘起来的 "+1" */
  function drawFloats() {
    if (!state.floats.length) return;
    ctx.save();
    ctx.font = 'bold 16px ' + FONT;
    for (const f of state.floats) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.6));
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255,252,240,0.92)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = INK;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.restore();
  }

  /**
   * 夜色：白天完全不画；日出日落染一层暖色；入夜后压暗，
   * 并在角色周围留一圈暖光，免得黑到看不见自己
   */
  function drawNight() {
    const ph = dayPhase(state.clock);
    const W = world.W;
    const H = world.H;

    // 日出 / 日落的暖色
    if (ph.warm > 0.01) {
      ctx.save();
      ctx.fillStyle = 'rgba(238,148,74,' + (ph.warm * 0.22).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    if (ph.dark <= 0.01) return;

    // 压暗
    ctx.save();
    ctx.fillStyle = 'rgba(16,30,56,' + (ph.dark * 0.52).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    // 角色身边的光：有火把时更亮、范围更大
    const p = state.player;
    const rad = Math.min(W, H) * (state.hasTorch ? 0.46 : 0.30);
    lightAt(p.x, p.y - 8, rad, ph.dark * (state.hasTorch ? 0.40 : 0.30));

    // 篝火自己也会照亮一圈，还会跟着火苗轻轻呼吸
    if (state.hasCampfire) {
      const c = world.campfire;
      const flick = 0.9 + Math.sin(state.time * 7) * 0.06 + Math.sin(state.time * 13) * 0.04;
      lightAt(c.x, c.y - 6, Math.min(W, H) * 0.34 * flick, ph.dark * 0.34 * flick);
    }

    ctx.restore();
  }

  /** 在夜色上开一扇暖色的"灯"，用来做角色、火把、篝火的光 */
  function lightAt(x, y, rad, alpha) {
    const g = ctx.createRadialGradient(x, y, rad * 0.12, x, y, rad);
    g.addColorStop(0, 'rgba(255,222,150,' + alpha.toFixed(3) + ')');
    g.addColorStop(0.55, 'rgba(255,210,130,' + (alpha * 0.34).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,210,130,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, world.W, world.H);
  }

  /** 主绘制：按 y 坐标排序，形成简单的前后遮挡关系 */
  function render() {
    const t = state.time;

    drawSea(t);
    drawIsland();
    drawPond(t);
    drawFarm(t);          // 农田画在地面层

    const list = [];
    // 砍掉的树和挖掉的石头也要画（树桩 / 碎石），所以不再过滤 alive
    for (const tr of state.trees) list.push(tr);
    for (const rk of state.rocks) list.push(rk);
    for (const b of state.bushes) list.push(b);
    for (const s of state.shells) if (s.alive) list.push(s);
    if (state.rare.active) list.push({ kind: 'rare', x: state.rare.x, y: state.rare.y });
    if (state.hasBench) list.push({ kind: 'bench', x: world.bench.x, y: world.bench.y });
    if (state.hasCampfire) list.push({ kind: 'campfire', x: world.campfire.x, y: world.campfire.y });
    list.push({ kind: 'player', x: state.player.x, y: state.player.y });
    list.sort((a, b) => a.y - b.y);

    for (const e of list) {
      if (e.kind === 'tree') drawTree(e);
      else if (e.kind === 'rock') drawRock(e);
      else if (e.kind === 'berry') drawBush(e);
      else if (e.kind === 'shell') drawShell(e);
      else if (e.kind === 'rare') drawRare();
      else if (e.kind === 'bench') drawBench();
      else if (e.kind === 'campfire') drawCampfire();
      else drawPlayer();
    }

    drawFishingLine(t);

    drawNight();            // 夜色盖在整个画面上

    // 提示性质的东西画在夜色之上，晚上也看得清
    drawContactProgress();
    drawFloats();
  }

  // ==================================================================
  // 6. 虚拟摇杆
  // ==================================================================
  let joyPointerId = null;

  /** 摇杆底盘的中心点和半径（每次按下重新算，避免旋转屏幕后错位） */
  function joyCenter() {
    const r = joystickEl.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r.width / 2 };
  }

  /**
   * 根据手指位置更新摇杆输出
   * 结果写进 state.joy：nx / ny 是"方向 × 力度"，mag 是力度 0..1
   */
  function joyUpdate(clientX, clientY) {
    const c = joyCenter();
    const dx = clientX - c.x;
    const dy = clientY - c.y;
    const maxOffset = c.r * 0.52;              // 小圆最多能偏离多远
    const len = Math.hypot(dx, dy);
    const mag = Math.min(len / maxOffset, 1);

    let ux = 0;
    let uy = 0;
    if (len > 0.001) {
      ux = dx / len;
      uy = dy / len;
    }

    state.joy.nx = ux * mag;
    state.joy.ny = uy * mag;
    state.joy.mag = mag;

    // 小圆跟着手指走（超出范围就贴着边缘）
    const kx = ux * mag * maxOffset;
    const ky = uy * mag * maxOffset;
    knobEl.style.transform = 'translate(' + kx.toFixed(1) + 'px, ' + ky.toFixed(1) + 'px)';
  }

  /** 松开摇杆：小圆回中间，输出归零，角色停在原地 */
  function joyReset() {
    joyPointerId = null;
    joystickEl.classList.remove('active');
    state.joy.nx = 0;
    state.joy.ny = 0;
    state.joy.mag = 0;
    knobEl.style.transform = 'translate(0px, 0px)';
  }

  joystickEl.addEventListener('pointerdown', e => {
    if (state.gameOver) return;
    e.preventDefault();
    if (joyPointerId !== null) return;
    joyPointerId = e.pointerId;
    try { joystickEl.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    joystickEl.classList.add('active');
    joyUpdate(e.clientX, e.clientY);
    hideHint();
  });

  joystickEl.addEventListener('pointermove', e => {
    if (e.pointerId !== joyPointerId) return;
    e.preventDefault();
    joyUpdate(e.clientX, e.clientY);
  });

  joystickEl.addEventListener('pointerup', e => {
    if (e.pointerId !== joyPointerId) return;
    e.preventDefault();
    joyReset();
  });

  joystickEl.addEventListener('pointercancel', e => {
    if (e.pointerId !== joyPointerId) return;
    joyReset();
  });

  // ==================================================================
  // 7. 游戏逻辑
  // ==================================================================

  /** 在资源位置冒出一个向上飘的文字 */
  function addFloat(x, y, text) {
    state.floats.push({ x: x, y: y, text: text, life: 0.9 });
  }

  /**
   * 采集一棵树 / 一块石头 / 一堆燧石 / 一丛浆果 / 一个贝壳
   * 注意：浆果丛摘完不会消失，只是没果子了；贝壳捡走会消失，等潮水再冲上来
   */
  function harvest(ent) {
    if (!ent || state.gameOver) return;
    // 浆果丛看"有没有结果"，其它资源看"还在不在"
    if (ent.kind === 'berry' ? !ent.ripe : !ent.alive) return;

    state.contact.target = null;
    state.contact.t = 0;
    state.contact.beat = 0;

    if (ent.kind === 'berry') {
      // 浆果丛：摘掉果子，丛还在
      ent.ripe = false;
      ent.regrow = REGROW_BERRY;
      state.berry += 1;
      showToast('浆果 +1');
      addFloat(ent.x, ent.y - ent.r * 1.5, '+1');
      sfx('berry');
      buzz('tap');

    } else if (ent.kind === 'shell') {
      ent.alive = false;
      ent.regrow = REGROW_SHELL;
      state.shell += 1;
      showToast('贝壳 +1');
      addFloat(ent.x, ent.y - ent.r * 2, '+1');
      sfx('shell');
      buzz('tap');

    } else if (ent.kind === 'tree') {
      ent.alive = false;
      ent.regrow = REGROW_TREE;   // 树桩很久之后才会重新长成树
      state.wood += 1;
      showToast('木材 +1');
      addFloat(ent.x, ent.y - ent.r * 1.5, '+1');
      sfx('chop');
      buzz('chop');
      useTool('axe');             // 石斧用掉一次耐久

    } else if (ent.kind === 'rare') {
      // 燧石堆：采完就没了，不会再生，只能等下一处自己冒出来
      const gain = 1 + (state.hasPick ? 1 : 0);
      state.flint += gain;
      state.rare.active = false;
      state.rare.alive = false;
      state.rare.life = 0;
      state.rare.wait = RARE_WAIT_MIN + Math.random() * (RARE_WAIT_MAX - RARE_WAIT_MIN);
      showToast('燧石 +' + gain);
      addFloat(ent.x, ent.y - ent.r * 1.4, '+' + gain);
      sfx('flint');
      buzz('mine');
      useTool('pick');

    } else {
      ent.alive = false;
      ent.regrow = REGROW_ROCK;   // 碎石很久之后才会重新变成石头
      const gain = state.hasPick ? 2 : 1;   // 有石镐一次挖出 2 个石头
      state.stone += gain;
      showToast('石头 +' + gain);
      addFloat(ent.x, ent.y - ent.r * 1.2, '+' + gain);
      sfx('mine');
      buzz('mine');
      useTool('pick');            // 石镐用掉一次耐久
    }

    syncResourceUI();
    syncCraftMenu();
    state.actionKey = '';         // 让右下角按钮立刻刷新
  }

  /**
   * 消耗一次工具耐久
   * 用完就坏掉：工具消失，要重新做一把
   */
  function useTool(kind) {
    if (kind === 'axe') {
      if (!state.hasAxe) return;
      state.axeUses -= 1;

      if (state.axeUses <= 0) {
        state.hasAxe = false;
        state.axeUses = 0;
        showToast('石斧用坏了 · 得再做一把');
        sfx('break');
      } else if (state.axeUses === WARN_USES) {
        showToast('石斧快坏了 · 还能砍 ' + state.axeUses + ' 次');
      }

    } else {
      if (!state.hasPick) return;
      state.pickUses -= 1;

      if (state.pickUses <= 0) {
        state.hasPick = false;
        state.pickUses = 0;
        showToast('石镐用坏了 · 得再做一把');
        sfx('break');
      } else if (state.pickUses === WARN_USES) {
        showToast('石镐快坏了 · 还能挖 ' + state.pickUses + ' 次');
      }
    }
  }

  /** 找出角色脚下贴着的资源（树、石头、浆果丛、贝壳、燧石堆） */
  function findContactTarget() {
    const p = state.player;
    let best = null;
    let bestD = Infinity;

    // 树和石头
    for (const e of state.trees.concat(state.rocks)) {
      if (!e.alive) continue;
      const d = Math.hypot(p.x - e.x, p.y - e.y);
      const reach = e.r * 0.75 + PLAYER_R + 6;
      if (d <= reach && d < bestD) {
        bestD = d;
        best = e;
      }
    }

    // 浆果丛：只有结果的时候才算目标
    for (const b of state.bushes) {
      if (!b.ripe) continue;
      const d = Math.hypot(p.x - b.x, p.y - b.y);
      const reach = b.r * 0.8 + PLAYER_R + 6;
      if (d <= reach && d < bestD) {
        bestD = d;
        best = b;
      }
    }

    // 贝壳：很小，判定放宽一点才好踩到
    for (const s of state.shells) {
      if (!s.alive) continue;
      const d = Math.hypot(p.x - s.x, p.y - s.y);
      const reach = s.r + PLAYER_R + 10;
      if (d <= reach && d < bestD) {
        bestD = d;
        best = s;
      }
    }

    // 燧石堆也算可采集目标，而且优先一点（它存在的时间有限）
    if (state.rare.active && state.rare.alive) {
      const r = state.rare;
      const d = Math.hypot(p.x - r.x, p.y - r.y);
      const reach = r.r * 0.85 + PLAYER_R + 8;
      if (d <= reach && d - 12 < bestD) return r;
    }

    return best;
  }

  /** 每帧处理"贴着资源"的逻辑：累计接触时间，够了就自动采集 */
  function updateContact(dt) {
    if (state.fishing.active) {
      state.contact.target = null;
      state.contact.t = 0;
      return;
    }

    const target = findContactTarget();
    if (target !== state.contact.target) {
      state.contact.target = target;
      state.contact.t = 0;
      state.contact.beat = 0;
    }
    if (!target) return;

    state.contact.t += dt;
    const need = contactNeed(target);

    // 采集过程中按节奏响几下轻轻的凿击声，让人知道"正在采"
    const beats = 3;
    const beat = Math.floor((state.contact.t / need) * beats);
    if (beat > state.contact.beat && beat < beats) {
      state.contact.beat = beat;
      sfx('tap');
    }

    if (state.contact.t >= need) harvest(target);
  }

  /**
   * 推进世界时间：昼夜循环 + 树石再生
   * 一天 DAY_LENGTH 秒，跨过午夜就是新的一天
   */
  function updateWorld(dt) {
    const before = state.clock;
    state.clock += dt / DAY_LENGTH;

    // 刚进入黄昏时提示一次
    if (before < DUSK_AT && state.clock >= DUSK_AT && !state.duskWarned) {
      state.duskWarned = true;
      showToast('天要黑了 · 夜里饿得更快');
      sfx('dusk');
    }

    // 跨过午夜：新的一天
    if (state.clock >= 1) {
      state.clock -= 1;
      state.day += 1;
      state.duskWarned = false;
      showToast('第 ' + state.day + ' 天');
      sfx('dawn');
    }

    // 树和石头慢慢长回来
    const list = state.trees.concat(state.rocks);
    for (const e of list) {
      if (!e.alive) {
        e.regrow -= dt;
        if (e.regrow <= 0) {
          e.regrow = 0;
          e.alive = true;
          e.grow = 0;        // 从小长到正常大小
          sfx('regrow');
        }
      } else if (e.grow < 1) {
        e.grow = Math.min(1, e.grow + dt * 2.2);
      }
    }

    // 贝壳：潮水过一阵子会再冲上来一个
    for (const s of state.shells) {
      if (!s.alive) {
        s.regrow -= dt;
        if (s.regrow <= 0) {
          s.regrow = 0;
          s.alive = true;
          s.grow = 0;
        }
      } else if (s.grow < 1) {
        s.grow = Math.min(1, s.grow + dt * 2.5);
      }
    }

    // 浆果丛：摘掉的果子过一阵子重新长出来
    for (const b of state.bushes) {
      if (!b.ripe) {
        b.regrow -= dt;
        if (b.regrow <= 0) {
          b.regrow = 0;
          b.ripe = true;
          sfx('regrow');
        }
      }
    }

    updateRare(dt);
  }

  /**
   * 稀有的燧石堆：隔一阵子在岛上随机冒出一处，一段时间没采就自己沉回沙里
   * 一次只会有一处，采掉之后要再等下一处
   */
  function updateRare(dt) {
    const r = state.rare;

    if (!r.active) {
      r.wait -= dt;
      if (r.wait <= 0) spawnRare();
      return;
    }

    // 出现动画
    if (r.appear < 1) r.appear = Math.min(1, r.appear + dt * 2.5);

    // 存在时间到了就沉回去
    r.life -= dt;
    if (r.life <= 0) {
      r.active = false;
      r.alive = false;
      r.appear = 0;
      r.wait = RARE_WAIT_MIN + Math.random() * (RARE_WAIT_MAX - RARE_WAIT_MIN);
      showToast('燧石堆被潮水盖住了');
    }
  }

  /** 在岛上一处随机、可站立、离玩家不太近的位置放下燧石堆 */
  function spawnRare() {
    const r = state.rare;
    const p = state.player;

    for (let i = 0; i < 80; i++) {
      const x = (0.14 + Math.random() * 0.72) * world.W;
      const y = (0.14 + Math.random() * 0.72) * world.H;

      if (!isWalkable(x, y)) continue;
      if (Math.hypot(x - p.x, y - p.y) < 70) continue;          // 别在脚边冒出来
      if (isNearFarm(x, y) || isNearCampfire(x, y)) continue;   // 别挡住农田和篝火
      if (inPond(x, y, 1.35)) continue;

      // 别跟树、石头叠在一起
      let clash = false;
      for (const e of state.trees.concat(state.rocks)) {
        if (e.alive && Math.hypot(x - e.x, y - e.y) < e.r + r.r + 14) { clash = true; break; }
      }
      if (clash) continue;

      r.x = x;
      r.y = y;
      r.active = true;
      r.alive = true;
      r.appear = 0;
      r.life = RARE_LIFE;
      showToast('沙滩上露出一堆燧石');
      sfx('flintfind');
      return;
    }

    // 实在找不到地方就再等一会儿
    r.wait = 8;
  }

  /** 摇杆驱动角色移动：按方向和力度前进，撞到海 / 水塘就停住 */
  function updatePlayer(dt) {
    const p = state.player;
    const nx = state.joy.nx;
    const ny = state.joy.ny;
    const mag = state.joy.mag;

    if (state.gameOver || state.fishing.active || mag < 0.08) {
      p.moving = false;
      return;
    }

    const speed = PLAYER_SPEED * mag;
    const mx = nx * speed * dt;
    const my = ny * speed * dt;

    // 分轴移动：撞到不可走的地方时只停住那个方向，可以贴着岸边滑动
    if (isWalkable(p.x + mx, p.y)) p.x += mx;
    if (isWalkable(p.x, p.y + my)) p.y += my;

    // 左右翻转朝向
    if (nx > 0.12) p.facing = 1;
    else if (nx < -0.12) p.facing = -1;

    p.moving = true;
    p.bob += dt * (6 + 10 * mag);
  }

  /** 开始钓鱼（需要站在水边）：先甩竿，然后等鱼咬钩 */
  function startFishing() {
    if (state.gameOver || state.fishing.active) return;
    if (!isNearPond(state.player.x, state.player.y)) {
      showToast('要先走到水边');
      return;
    }

    const f = state.fishing;
    f.active = true;
    f.phase = 'wait';
    f.t = 0;

    // 有鱼竿：咬钩更快、收杆窗口更宽，这是做鱼竿的意义
    const wMin = state.hasRod ? ROD_WAIT_MIN : FISH_WAIT_MIN;
    const wMax = state.hasRod ? ROD_WAIT_MAX : FISH_WAIT_MAX;
    f.wait = wMin + Math.random() * (wMax - wMin);
    f.window = state.hasRod ? ROD_WINDOW : FISH_WINDOW;

    state.contact.target = null;
    state.contact.t = 0;
    state.contact.beat = 0;

    fishPanelEl.classList.add('show');
    fishPanelEl.classList.remove('bite');
    fishLabelEl.textContent = '等鱼咬钩…';
    fishFillEl.style.width = '0%';

    sfx('cast');        // 甩竿
    sfx('plop');        // 浮漂入水（内部带一点延迟）
    state.actionKey = '';
    syncActionUI();
  }

  /**
   * 结束这次钓鱼
   * result: 'catch' 钓到 / 'early' 收杆太早 / 'miss' 错过时机
   */
  function endFishing(result) {
    const f = state.fishing;
    if (!f.active) return;

    f.active = false;
    f.phase = 'idle';
    f.t = 0;

    fishPanelEl.classList.remove('show', 'bite');
    fishLabelEl.textContent = '等鱼咬钩…';
    fishFillEl.style.width = '0%';

    if (result === 'catch') {
      state.fish += 1;
      showToast('鱼 +1 · 去篝火边烤一下更顶饱');
      addFloat(state.player.x, state.player.y - 46, '+1');
      sfx('catch');
      buzz('catch');
    } else if (result === 'early') {
      showToast('收杆太早，鱼被吓跑了');
      sfx('miss');
    } else {
      showToast('鱼跑了…再试一次');
      sfx('miss');
    }

    syncResourceUI();
    state.actionKey = '';
    syncActionUI();
  }

  /** 点「收杆」：咬钩时收杆算成功，提前收就是空杆 */
  function reel() {
    const f = state.fishing;
    if (!f.active) return;
    if (f.phase === 'bite') endFishing('catch');
    else endFishing('early');
  }

  /** 钓鱼推进：等待 → 咬钩 → 窗口内没点就跑了 */
  function updateFishing(dt) {
    const f = state.fishing;
    if (!f.active) return;

    f.t += dt;

    if (f.phase === 'wait') {
      if (f.t >= f.wait) {
        // 咬钩了！
        f.phase = 'bite';
        f.t = 0;
        fishPanelEl.classList.add('bite');
        fishLabelEl.textContent = '咬钩了！点一下收杆';
        fishFillEl.style.width = '100%';
        sfx('bite');
        buzz('bite');
        state.actionKey = '';   // 让右下角按钮立刻变成「收杆!」
        syncActionUI();
      }
      return;
    }

    if (f.phase === 'bite') {
      const k = Math.max(0, 1 - f.t / f.window);
      fishFillEl.style.width = (k * 100).toFixed(1) + '%';
      if (f.t >= f.window) endFishing('miss');
    }
  }

  /** 在篝火边烤鱼：生鱼 → 熟鱼（恢复的饥饿多一倍） */
  function cookFish() {
    if (state.gameOver) return;
    if (!state.hasCampfire) return;

    if (state.fish < 1) {
      showToast('还没有鱼可以烤');
      return;
    }

    state.fish -= 1;
    state.cooked += 1;

    showToast('烤好一条鱼 · 熟鱼 +1');
    addFloat(world.campfire.x, world.campfire.y - 34, '+1');
    sfx('cook');
    buzz('craft');

    syncResourceUI();
    syncCraftMenu();
  }

  /** 农田：建造 / 播种 / 收获，根据当前状态自动决定做哪一步 */
  function farmAction() {
    const f = state.farm;

    // 1) 还没建：需要工作台 + 木材石头
    if (!f.built) {
      if (!state.hasBench) {
        showToast('要先做好工作台');
        return;
      }
      if (state.wood < WOOD_COST_FARM || state.stone < STONE_COST_FARM) {
        showToast('材料不足：木材 ' + WOOD_COST_FARM + ' · 石头 ' + STONE_COST_FARM);
        return;
      }
      state.wood -= WOOD_COST_FARM;
      state.stone -= STONE_COST_FARM;
      f.built = true;
      showToast('农田建好了');
      sfx('build');
      buzz('craft');
      syncResourceUI();
      syncCraftMenu();
      return;
    }

    // 2) 建好了但没种：播种
    if (!f.planted) {
      f.planted = true;
      f.growth = 0;
      f.ready = false;
      showToast('已播种 · ' + FARM_GROW_TIME + ' 秒后成熟');
      sfx('plant');
      return;
    }

    // 3) 成熟了：收获
    if (f.ready) {
      f.planted = false;
      f.growth = 0;
      f.ready = false;
      state.food += 1;
      showToast('食物 +1');
      addFloat(world.farm.x, world.farm.y - 30, '+1');
      sfx('harvest');
      buzz('chop');
      syncResourceUI();
      return;
    }

    // 4) 还在长：提示剩余时间
    const left = Math.ceil(FARM_GROW_TIME * (1 - f.growth));
    showToast('作物还需 ' + left + ' 秒');
  }

  /** 吃浆果 / 贝壳 / 鱼 / 食物 / 烤鱼，恢复饥饿度 */
  function eat(kind) {
    if (state.gameOver) return;

    if (state.hunger >= HUNGER_MAX - 0.5) {
      showToast('还不饿');
      return;
    }

    if (kind === 'berry') {
      if (state.berry <= 0) { showToast('还没有浆果 · 草地上找浆果丛'); return; }
      state.berry -= 1;
      state.hunger = Math.min(HUNGER_MAX, state.hunger + EAT_BERRY_HUNGER);
      showToast('吃了一把浆果 · 饥饿 +' + EAT_BERRY_HUNGER);
    } else if (kind === 'shell') {
      if (state.shell <= 0) { showToast('还没有贝壳 · 南边沙滩上捡'); return; }
      state.shell -= 1;
      state.hunger = Math.min(HUNGER_MAX, state.hunger + EAT_SHELL_HUNGER);
      showToast('吃了一个贝壳 · 饥饿 +' + EAT_SHELL_HUNGER);
    } else if (kind === 'fish') {
      if (state.fish <= 0) { showToast('还没有鱼'); return; }
      state.fish -= 1;
      state.hunger = Math.min(HUNGER_MAX, state.hunger + EAT_FISH_HUNGER);
      showToast('吃了一条生鱼 · 饥饿 +' + EAT_FISH_HUNGER);
    } else if (kind === 'cooked') {
      if (state.cooked <= 0) { showToast('还没有烤鱼 · 去篝火边烤'); return; }
      state.cooked -= 1;
      state.hunger = Math.min(HUNGER_MAX, state.hunger + EAT_COOKED_HUNGER);
      showToast('吃了一条烤鱼 · 饥饿 +' + EAT_COOKED_HUNGER);
    } else {
      if (state.food <= 0) { showToast('还没有食物'); return; }
      state.food -= 1;
      state.hunger = Math.min(HUNGER_MAX, state.hunger + EAT_FOOD_HUNGER);
      showToast('吃了一份食物 · 饥饿 +' + EAT_FOOD_HUNGER);
    }

    sfx('eat');
    syncResourceUI();
    syncHungerUI();
  }

  /** 饥饿度耗尽：弹出"游戏结束"，并停掉所有操作 */
  function endGame() {
    if (state.gameOver) return;
    state.gameOver = true;

    state.fishing.active = false;
    state.fishing.phase = 'idle';
    state.fishing.t = 0;
    fishPanelEl.classList.remove('show', 'bite');
    state.contact.target = null;
    state.contact.t = 0;
    state.player.moving = false;
    joyReset();
    closeCraftMenu();

    clearSave();        // 这局结束了，下次打开是全新的一局
    sfx('over');

    overlayEl.classList.add('show');
    syncActionUI();
  }

  /** 每帧更新：昼夜、饥饿、钓鱼、作物、移动、贴脸采集 */
  function update(dt) {
    state.time += dt;   // 时间一直走，水波和虚线才继续动

    // 飘字动画（结束后也让它自然飘完）
    for (let i = state.floats.length - 1; i >= 0; i--) {
      const f = state.floats[i];
      f.life -= dt;
      f.y -= 26 * dt;
      if (f.life <= 0) state.floats.splice(i, 1);
    }

    if (state.gameOver) return;   // 游戏结束后一切停止

    // 1) 昼夜推进 + 树石再生
    updateWorld(dt);
    syncDayUI();

    // 2) 饥饿度随时间下降，夜里额外快一点
    const dark = dayPhase(state.clock).dark;
    state.hunger = Math.max(0, state.hunger - HUNGER_DRAIN * (1 + dark * NIGHT_HUNGER) * dt);
    syncHungerUI();
    if (state.hunger <= 0) {
      endGame();
      return;
    }

    // 3) 声音氛围：低饥饿的心跳、偶尔的鸟叫、定时存档
    updateHeartbeat(dt);
    state.nextBird -= dt;
    if (state.nextBird <= 0) {
      state.nextBird = 7 + Math.random() * 9;
      sfx('bird');
    }
    state.saveT += dt;
    if (state.saveT >= 4) {
      state.saveT = 0;
      saveGame();
    }

    // 4) 钓鱼：等待咬钩 → 抓时机收杆
    if (state.fishing.active) updateFishing(dt);

    // 5) 农田生长
    const farm = state.farm;
    if (farm.built && farm.planted && !farm.ready) {
      farm.growth = Math.min(1, farm.growth + dt / FARM_GROW_TIME);
      if (farm.growth >= 1) {
        farm.ready = true;
        showToast('作物成熟了');
        sfx('mature');
      }
    }

    // 6) 摇杆移动 + 贴脸采集
    updatePlayer(dt);
    updateContact(dt);

    // 7) 互动按钮随情境变化
    syncActionUI();
  }

  // ==================================================================
  // 8. 界面同步（数值和按钮状态实时更新）
  // ==================================================================

  function syncResourceUI() {
    woodNumEl.textContent = state.wood;
    stoneNumEl.textContent = state.stone;

    berryNumEl.textContent = state.berry;

  function syncDayUI() {
    const name = phaseName(state.clock);
    const key = state.day + '|' + name;
    if (key === dayKeyCache) return;
    dayKeyCache = key;

    dayNumEl.textContent = '第 ' + state.day + ' 天';

  function syncHungerUI() {
    const ratio = state.hunger / HUNGER_MAX;
    hungerFillEl.style.width = (ratio * 100).toFixed(1) + '%';

  /** 左上角弹一下提示文字 */

    toastEl.textContent = text;

   *   done()      是否已经做过（做过就显示 doneLabel 并且不能再点）

   *   apply()     真正生效的那一下
   *
   * 解锁顺序：先造工作台，工作台造好之后其它配方才会亮起来

  const RECIPES = [
    {

      wood: WOOD_COST_AXE, stone: 0, flint: 0,

      wood: 3, stone: 3, flint: 1,
      locked: () => !state.hasBench,
      done: () => state.hasPick, doneLabel: '已装备',

      msg: '石镐做好了 · 挖矿更快更多',

    },

      id: 'campfire', name: '篝火', desc: '夜里照亮周围，还能把生鱼烤熟',

      locked: () => !state.hasBench,

      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#4a3a2a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21 L15 6"/><path d="M15 6 q4 6 1 11"/><circle cx="17" cy="19.5" r="1.6" fill="#4a3a2a" stroke="none"/></svg>',
      wood: 3, stone: 1, flint: 0,
      locked: () => !state.hasBench,
      done: () => state.hasRod, doneLabel: '已装备',
      msg: '鱼竿做好了 · 钓鱼更顺手',
