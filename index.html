  const recipeRows = {};   // id → { row, btn, costEl }，界面上的那一行

  /** 按 RECIPES 生成制作菜单里的每一行（只在启动时跑一次） */
  function buildCraftRows() {
    recipeListEl.innerHTML = '';

    for (const r of RECIPES) {
      const row = document.createElement('div');
      row.className = 'recipe';
      row.innerHTML =
        '<div class="r-icon">' + r.icon + '</div>' +
        '<div class="r-info">' +
          '<div class="r-name">' + r.name + '</div>' +
          '<div class="r-cost"></div>' +
          '<div class="r-desc">' + r.desc + '</div>' +
        '</div>' +
        '<button class="r-btn">制作</button>';

      const btn = row.querySelector('.r-btn');
      const costEl = row.querySelector('.r-cost');
      btn.addEventListener('click', () => craft(r.id));

      recipeRows[r.id] = { row: row, btn: btn, costEl: costEl };
      recipeListEl.appendChild(row);
    }
  }

  /** 刷新每条配方的按钮状态和材料颜色 */
  function syncCraftMenu() {
    for (const r of RECIPES) {
      const row = recipeRows[r.id];
      if (!row) continue;

      // 还没解锁：整行压暗，按钮显示"未解锁"
      const locked = r.locked ? r.locked() : false;
      row.row.classList.toggle('locked', locked);

      if (locked) {
        row.btn.textContent = '未解锁';
        row.btn.disabled = true;
        row.costEl.innerHTML = '<span class="lack">需要先造工作台</span>';
        continue;
      }

      const done = r.done();
      const canWood = state.wood >= r.wood;
      const canStone = state.stone >= r.stone;
      const canFlint = state.flint >= r.flint;

      row.btn.textContent = done ? r.doneLabel : '制作';
      row.btn.disabled = done || !canWood || !canStone || !canFlint;

      // 做过的工具显示还能用几次，没做的显示材料
      if (done && r.note) {
        row.costEl.innerHTML = '<span class="note">' + r.note() + '</span>';
        continue;
      }

      let cost = '';
      if (r.wood > 0) cost += '木材 ' + costSpan(state.wood, r.wood, '×' + r.wood);
      if (r.stone > 0) {
        if (cost) cost += ' · ';
        cost += '石头 ' + costSpan(state.stone, r.stone, '×' + r.stone);
      }
      if (r.flint > 0) {
        if (cost) cost += ' · ';
        cost += '燧石 ' + costSpan(state.flint, r.flint, '×' + r.flint);
      }
      row.costEl.innerHTML = cost;
    }
  }

  /** 材料不够时把数字标红 */
  function costSpan(have, need, text) {
    return have >= need ? text : '<span class="lack">' + text + '</span>';
  }

  function openCraftMenu() {
    if (state.gameOver) return;
    syncCraftMenu();
    craftMenuEl.classList.add('show');
  }

  function closeCraftMenu() {
    craftMenuEl.classList.remove('show');
  }

  /** 制作：查配方表 → 扣材料 → 生效 */
  function craft(id) {
    if (state.gameOver) return;

    const r = RECIPES.find(x => x.id === id);
    if (!r) return;
    if (r.locked && r.locked()) {
      showToast('要先造好工作台');
      return;
    }
    if (r.done()) return;

    if (state.wood < r.wood || state.stone < r.stone || state.flint < r.flint) {
      showToast('材料不够');
      return;
    }

    state.wood -= r.wood;
    state.stone -= r.stone;
    state.flint -= r.flint;
    r.apply();

    showToast(r.msg);
    sfx('build');
    buzz('craft');

    syncResourceUI();
    syncCraftMenu();
    state.actionKey = '';   // 让右下角按钮立刻刷新（篝火建好就能烤鱼了）
    syncActionUI();
  }

  // ---------- 右下角互动按钮 ----------

  const ACTION_ICONS = {
    chop:  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff8e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21 L15 9"/><path d="M12 4 q6 -2 8 4 q-5 3 -9 1 z" fill="#fff8e6" stroke="none"/></svg>',
    mine:  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff8e6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21 L12 8"/><path d="M3 9 q9 -7 18 0"/></svg>',
    fish:  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff8e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 L14 5"/><path d="M14 5 q5 5 2 10"/><circle cx="17" cy="18" r="1.8" fill="#fff8e6" stroke="none"/></svg>',
    build: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff8e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20 L13 10"/><path d="M11 3 h8 v6 h-8 z" fill="#fff8e6" stroke="none"/></svg>',
    plant: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff8e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21 L12 11"/><path d="M12 13 q-7 -1 -7 -7 q7 0 7 6"/><path d="M12 12 q7 -1 7 -7 q-7 0 -7 6"/></svg>',
    take:  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff8e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 h16 l-2 9 h-12 z"/><path d="M8 11 q4 -8 8 0"/></svg>',
    reel:  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff8e6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 v13"/><path d="M6 12 l6 7 6-7"/></svg>',
    cook:  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff8e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14 h16"/><path d="M6 14 q0 6 6 6 q6 0 6 -6"/><path d="M9 10 q1.6 -2 0 -4"/><path d="M14 10 q1.6 -2 0 -4"/></svg>'
  };

  /**
   * 当前情境：决定右下角按钮显示什么
   * 优先级：钓鱼中 > 贴着的资源 > 篝火 > 农田 > 水边
   */
  function getContext() {
    const p = state.player;

    // 钓鱼中：按钮变成「收杆」，鱼咬钩的那一下会高亮
    if (state.fishing.active) {
      const biting = state.fishing.phase === 'bite';
      return {
        icon: 'reel',
        label: biting ? '收杆!' : '收杆',
        type: 'reel',
        enabled: true,
        hot: biting
      };
    }

    // 贴着的资源：树、石头、浆果丛、贝壳、燧石堆
    const ct = state.contact.target;
    const near = (ct && (ct.alive || ct.ripe)) ? ct : findContactTarget();
    if (near) {
      if (near.kind === 'tree') {
        return { icon: 'chop', label: '砍树', type: 'harvest', ent: near, enabled: true };
      }
      if (near.kind === 'rare') {
        return { icon: 'mine', label: '采燧石', type: 'harvest', ent: near, enabled: true };
      }
      if (near.kind === 'berry') {
        return { icon: 'plant', label: '摘浆果', type: 'harvest', ent: near, enabled: true };
      }
      if (near.kind === 'shell') {
        return { icon: 'take', label: '捡贝壳', type: 'harvest', ent: near, enabled: true };
      }
      return { icon: 'mine', label: '挖矿', type: 'harvest', ent: near, enabled: true };
    }

    // 篝火：烤鱼
    if (state.hasCampfire && isNearCampfire(p.x, p.y)) {
      return {
        icon: 'cook',
        label: '烤鱼',
        type: 'cook',
        enabled: state.fish > 0
      };
    }

    // 农田
    if (isNearFarm(p.x, p.y)) {
      const f = state.farm;
      if (!f.built) {
        const can = state.hasBench &&
                    state.wood >= WOOD_COST_FARM && state.stone >= STONE_COST_FARM;
        return { icon: 'build', label: '建农田', type: 'farm', enabled: can };
      }
      if (!f.planted) {
        return { icon: 'plant', label: '播种', type: 'farm', enabled: true };
      }
      if (f.ready) {
        return { icon: 'take', label: '收获', type: 'farm', enabled: true };
      }
      return null;   // 生长中不显示按钮
    }

    // 水边
    if (isNearPond(p.x, p.y) && !state.fishing.active) {
      return { icon: 'fish', label: '钓鱼', type: 'fish', enabled: true };
    }

    return null;
  }

  /** 刷新右下角按钮（带缓存，避免每帧写 DOM） */
  function syncActionUI() {
    const c = state.gameOver ? null : getContext();
    const key = c
      ? c.label + '|' + (c.enabled ? '1' : '0') + (c.hot ? '|hot' : '')
      : '';

    if (key === state.actionKey) return;
    state.actionKey = key;

    if (!c) {
      actionBtn.classList.remove('show', 'hot');
      return;
    }

    actionIcon.innerHTML = ACTION_ICONS[c.icon];
    actionLabel.textContent = c.label;
    actionBtn.classList.toggle('dim', !c.enabled);
    actionBtn.classList.toggle('hot', !!c.hot);
    actionBtn.classList.add('show');
  }

  /** 点右下角按钮：按当前情境执行 */
  function doAction() {
    if (state.gameOver) return;
    const c = getContext();
    if (!c) return;

    if (c.type === 'harvest') {
      harvest(c.ent);           // 有工具就是"点一下秒采集"
    } else if (c.type === 'fish') {
      startFishing();
    } else if (c.type === 'reel') {
      reel();
    } else if (c.type === 'cook') {
      cookFish();
    } else if (c.type === 'farm') {
      farmAction();
    }
    state.actionKey = '';       // 强制下一帧刷新按钮
    syncActionUI();
  }

  // ==================================================================
  // 9. 事件绑定
  // ==================================================================
  actionBtn.addEventListener('click', doAction);
  berryChipEl.addEventListener('click', () => eat('berry'));
  shellChipEl.addEventListener('click', () => eat('shell'));
  fishChipEl.addEventListener('click', () => eat('fish'));
  foodChipEl.addEventListener('click', () => eat('food'));
  cookedChipEl.addEventListener('click', () => eat('cooked'));

  craftOpenBtn.addEventListener('click', () => {
    if (craftMenuEl.classList.contains('show')) {
      sfx('close');
      closeCraftMenu();
    } else {
      sfx('open');
      openCraftMenu();
    }
  });
  craftCloseEl.addEventListener('click', () => {
    sfx('close');
    closeCraftMenu();
  });
  craftMenuEl.addEventListener('click', e => {
    if (e.target === craftMenuEl) closeCraftMenu();   // 点空白处关闭
  });

  // 音效开关
  soundBtn.addEventListener('click', toggleSound);

  // 制作面板底部的"重新开始"：第一次点变成确认，再点一次才真的重开
  let resetArmed = false;
  let resetTimer = null;

  function disarmReset() {
    resetArmed = false;
    sheetResetBtn.textContent = '重新开始';
    sheetResetBtn.classList.remove('armed');
    if (resetTimer) {
      clearTimeout(resetTimer);
      resetTimer = null;
    }
  }

  sheetResetBtn.addEventListener('click', () => {
    sfx('click');
    if (!resetArmed) {
      resetArmed = true;
      sheetResetBtn.textContent = '再点一次确认重开';
      sheetResetBtn.classList.add('armed');
      resetTimer = setTimeout(disarmReset, 3000);
      return;
    }
    disarmReset();
    closeCraftMenu();
    restart();
    showToast('已重新开始');
  });

  restartBtn.addEventListener('click', restart);

  // ==================================================================
  // 10. 重开一局
  // ==================================================================
  function resetPlayer() {
    const p = state.player;
    p.x = world.island.cx;
    p.y = world.island.cy;
    p.moving = false;
    p.bob = 0;
    p.facing = 1;
    joyReset();
  }

  function restart() {
    state.wood = 0;
    state.stone = 0;
    state.flint = 0;
    state.berry = 0;
    state.shell = 0;
    state.fish = 0;
    state.food = 0;
    state.cooked = 0;
    state.hunger = HUNGER_MAX;
    state.hasAxe = false;
    state.hasPick = false;
    state.hasBench = false;
    state.hasCampfire = false;
    state.hasTorch = false;
    state.hasRod = false;
    state.axeUses = 0;
    state.pickUses = 0;
    state.rare.active = false;
    state.rare.alive = false;
    state.rare.appear = 0;
    state.rare.life = 0;
    state.rare.wait = 18;
    state.gameOver = false;
    state.floats = [];
    state.contact.target = null;
    state.contact.t = 0;
    state.contact.beat = 0;
    state.fishing.active = false;
    state.fishing.phase = 'idle';
    state.fishing.t = 0;
    state.farm.built = false;
    state.farm.planted = false;
    state.farm.growth = 0;
    state.farm.ready = false;
    state.actionKey = '';
    state.heartT = 0;
    state.nextBird = 7;
    state.saveT = 0;

    // 时间回到第一天的清晨
    state.day = 1;
    state.clock = DAY_START;
    state.duskWarned = false;
    dayKeyCache = '';

    buildEntities();     // 树和石头全部长回来
    layoutWorld();
    resetPlayer();

    overlayEl.classList.remove('show');
    fishPanelEl.classList.remove('show');
    actionBtn.classList.remove('show');
    closeCraftMenu();
    clearSave();         // 旧存档作废，紧接着写一份新的
    syncResourceUI();
    syncHungerUI();
    syncCraftMenu();
    syncActionUI();
    saveGame();
  }

  // ==================================================================
  // 11. 音效（全部用 Web Audio 实时合成，不加载任何音频文件）
  // 想改音色就改 sfx() 里对应的那一条
  // ==================================================================
  const SOUND_KEY = 'island-survival-sound';

  const Sound = {
    ctx: null,      // AudioContext，第一次触摸屏幕时才创建（iOS 的硬性要求）
    master: null,   // 总音量节点
    enabled: true,  // 玩家是否打开音效
    ambient: null   // 海浪的环境音
  };

  /** 读取音效开关（上次的选择会记住） */
  function loadSoundPref() {
    try {
      if (localStorage.getItem(SOUND_KEY) === '0') Sound.enabled = false;
    } catch (e) {
      // 无痕模式下读不到存储，用默认值就行
    }
  }

  function saveSoundPref() {
    try {
      localStorage.setItem(SOUND_KEY, Sound.enabled ? '1' : '0');
    } catch (e) { /* 忽略 */ }
  }

  /**
   * 拿到 AudioContext，需要时恢复播放
   * iOS 要求音频必须在"用户手势"里创建或恢复，所以第一次摸屏幕才会真正生效
   */
  function audioCtx() {
    if (!Sound.enabled) return null;

    if (!Sound.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try {
        Sound.ctx = new AC();
      } catch (e) {
        return null;
      }
      Sound.master = Sound.ctx.createGain();
      Sound.master.gain.value = 0.85;
      Sound.master.connect(Sound.ctx.destination);
      startAmbient();
    }

    if (Sound.ctx.state === 'suspended') {
      const p = Sound.ctx.resume();
      if (p && p.catch) p.catch(() => {});
    }
    return Sound.ctx;
  }

  /** 第一次触摸屏幕时把音频"解锁" */
  function unlockAudio() {
    if (!Sound.enabled) return;
    audioCtx();
  }

  /**
   * 播放一个音
   * o: { freq 起始频率, to 结束频率, dur 时长, type 波形, gain 音量, delay 延迟, attack 起音 }
   */
  function playTone(o) {
    const ac = audioCtx();
    if (!ac) return;

    const t0 = ac.currentTime + (o.delay || 0);
    const dur = o.dur || 0.2;
    const peak = o.gain == null ? 0.2 : o.gain;

    const osc = ac.createOscillator();
    const g = ac.createGain();

    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.freq, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(30, o.to), t0 + dur);

    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(dur * 0.4, o.attack || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    osc.connect(g);
    g.connect(Sound.master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  /**
   * 播放一段噪声，木头、石头、水声、咀嚼声都是它变形出来的
   * o: { freq 起始滤波频率, to 结束频率, dur 时长, gain 音量, q 谐振, filter 滤波类型, delay 延迟 }
   */
  function playNoise(o) {
    const ac = audioCtx();
    if (!ac) return;

    const t0 = ac.currentTime + (o.delay || 0);
    const dur = o.dur || 0.15;
    const peak = o.gain == null ? 0.18 : o.gain;

    const n = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;

    const src = ac.createBufferSource();
    src.buffer = buf;

    const flt = ac.createBiquadFilter();
    flt.type = o.filter || 'bandpass';
    flt.frequency.setValueAtTime(o.freq || 900, t0);
    if (o.to) flt.frequency.exponentialRampToValueAtTime(Math.max(60, o.to), t0 + dur);
    flt.Q.value = o.q == null ? 1 : o.q;

    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    src.connect(flt);
    flt.connect(g);
    g.connect(Sound.master);
    src.start(t0);
    src.stop(t0 + dur + 0.03);
  }

  /** 环境音：海浪的低频底噪，用很慢的起伏让它像真的海 */
  function startAmbient() {
    if (!Sound.ctx || Sound.ambient) return;
    const ac = Sound.ctx;

    const len = Math.floor(ac.sampleRate * 2);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    const src = ac.createBufferSource();
    src.buffer = buf;
    src.loop = true;

    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 480;
    lp.Q.value = 0.7;

    const g = ac.createGain();
    g.gain.value = 0.05;

    // 很慢的 LFO：浪声一起一伏
    const lfo = ac.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.11;
    const lfoGain = ac.createGain();
    lfoGain.gain.value = 0.032;
    lfo.connect(lfoGain);
    lfoGain.connect(g.gain);

    src.connect(lp);
    lp.connect(g);
    g.connect(Sound.master);
    src.start();
    lfo.start();

    Sound.ambient = { src: src, lfo: lfo, gain: g };
  }

  function stopAmbient() {
    if (!Sound.ambient) return;
    try {
      Sound.ambient.src.stop();
      Sound.ambient.lfo.stop();
    } catch (e) { /* 已经停了就忽略 */ }
    Sound.ambient = null;
  }

  /** 音效表：每个名字对应一小段合成出来的声音 */
  function sfx(name) {
    if (!Sound.enabled) return;

    switch (name) {
      case 'chop':      // 砍树：木头的闷响
        playNoise({ freq: 760, to: 260, dur: 0.16, gain: 0.22, q: 1.4 });
        playTone({ freq: 190, to: 110, dur: 0.14, type: 'triangle', gain: 0.14 });
        break;

      case 'mine':      // 挖石头：清脆的碎石声
        playNoise({ freq: 2600, to: 1500, dur: 0.11, gain: 0.17, q: 2.2 });
        playTone({ freq: 1350, to: 900, dur: 0.09, type: 'square', gain: 0.05 });
        break;

      case 'tap':       // 采集过程中的小凿击
        playNoise({ freq: 1100, to: 700, dur: 0.06, gain: 0.09, q: 1.6 });
        break;

      case 'cast':      // 甩竿
        playNoise({ freq: 420, to: 2400, dur: 0.22, gain: 0.11, q: 0.9 });
        break;

      case 'plop':      // 浮漂入水
        playTone({ freq: 340, to: 170, dur: 0.2, type: 'sine', gain: 0.16, delay: 0.18 });
        playNoise({ freq: 700, to: 300, dur: 0.16, gain: 0.07, filter: 'lowpass', delay: 0.18 });
        break;

      case 'catch':     // 上钩：三连上行，一听就知道成功了
        playTone({ freq: 660, dur: 0.1, type: 'triangle', gain: 0.16 });
        playTone({ freq: 880, dur: 0.1, type: 'triangle', gain: 0.16, delay: 0.08 });
        playTone({ freq: 1320, dur: 0.22, type: 'triangle', gain: 0.14, delay: 0.16 });
        break;

      case 'build':     // 建造 / 制作完成：向上的琶音
        playTone({ freq: 523, dur: 0.14, type: 'triangle', gain: 0.15 });
        playTone({ freq: 659, dur: 0.14, type: 'triangle', gain: 0.15, delay: 0.09 });
        playTone({ freq: 784, dur: 0.14, type: 'triangle', gain: 0.14, delay: 0.18 });
        playTone({ freq: 1047, dur: 0.3, type: 'triangle', gain: 0.13, delay: 0.27 });
        break;

      case 'plant':     // 播种：泥土的沙沙声
        playNoise({ freq: 520, to: 240, dur: 0.22, gain: 0.13, filter: 'lowpass' });
        break;

      case 'harvest':   // 收获：轻快的一声
        playNoise({ freq: 1800, to: 900, dur: 0.1, gain: 0.12, q: 1.2 });
        playTone({ freq: 720, to: 980, dur: 0.16, type: 'triangle', gain: 0.11 });
        break;

      case 'mature':    // 作物成熟：两声风铃
        playTone({ freq: 880, dur: 0.5, type: 'sine', gain: 0.13 });
        playTone({ freq: 1175, dur: 0.6, type: 'sine', gain: 0.1, delay: 0.14 });
        break;

      case 'eat':       // 吃东西：两下咀嚼
        playNoise({ freq: 420, dur: 0.09, gain: 0.14, filter: 'lowpass' });
        playNoise({ freq: 360, dur: 0.1, gain: 0.12, filter: 'lowpass', delay: 0.13 });
        playTone({ freq: 240, to: 180, dur: 0.18, type: 'sine', gain: 0.07, delay: 0.05 });
        break;

      case 'click':     // 按钮
        playTone({ freq: 1250, dur: 0.04, type: 'square', gain: 0.05 });
        break;

      case 'open':      // 菜单弹出
        playNoise({ freq: 300, to: 1400, dur: 0.16, gain: 0.07, q: 0.8 });
        break;

      case 'close':     // 菜单收起
        playNoise({ freq: 1200, to: 300, dur: 0.14, gain: 0.06, q: 0.8 });
        break;

      case 'over':      // 游戏结束：下行的闷音
        playTone({ freq: 440, dur: 0.35, type: 'sawtooth', gain: 0.08 });
        playTone({ freq: 349, dur: 0.35, type: 'sawtooth', gain: 0.08, delay: 0.22 });
        playTone({ freq: 262, dur: 0.6, type: 'sawtooth', gain: 0.09, delay: 0.44 });
        break;

      case 'heart':     // 低饥饿时的心跳
        playTone({ freq: 120, to: 60, dur: 0.16, type: 'sine', gain: 0.24 });
        playTone({ freq: 100, to: 55, dur: 0.18, type: 'sine', gain: 0.17, delay: 0.22 });
        break;

      case 'bird':      // 偶尔的鸟叫
        playTone({ freq: 2100, to: 2900, dur: 0.08, type: 'sine', gain: 0.05 });
        playTone({ freq: 2600, to: 2000, dur: 0.1, type: 'sine', gain: 0.04, delay: 0.1 });
        break;

      case 'dusk':      // 入夜：两声低沉的风铃
        playTone({ freq: 392, dur: 0.5, type: 'sine', gain: 0.1 });
        playTone({ freq: 294, dur: 0.7, type: 'sine', gain: 0.09, delay: 0.3 });
        break;

      case 'dawn':      // 天亮：明亮的琶音
        playTone({ freq: 587, dur: 0.3, type: 'triangle', gain: 0.1 });
        playTone({ freq: 784, dur: 0.3, type: 'triangle', gain: 0.1, delay: 0.12 });
        playTone({ freq: 1175, dur: 0.5, type: 'triangle', gain: 0.08, delay: 0.24 });
        break;

      case 'regrow':    // 资源长回来：轻轻的"噗"一声
        playNoise({ freq: 900, to: 1700, dur: 0.18, gain: 0.05, q: 0.8 });
        break;

      case 'bite':      // 鱼咬钩：急促的上行双音，必须一耳朵听出来
        playTone({ freq: 880, dur: 0.07, type: 'square', gain: 0.10 });
        playTone({ freq: 1320, dur: 0.09, type: 'square', gain: 0.09, delay: 0.07 });
        playNoise({ freq: 1600, to: 700, dur: 0.14, gain: 0.10, q: 1.2 });
        break;

      case 'miss':      // 空杆：下行的一声，有点懊恼
        playTone({ freq: 400, to: 220, dur: 0.26, type: 'triangle', gain: 0.09 });
        break;

      case 'cook':      // 烤鱼：油脂的滋滋声
        playNoise({ freq: 3200, to: 1800, dur: 0.5, gain: 0.07, q: 0.7 });
        playNoise({ freq: 2400, to: 1400, dur: 0.35, gain: 0.05, q: 0.9, delay: 0.18 });
        playTone({ freq: 330, dur: 0.22, type: 'sine', gain: 0.07, delay: 0.1 });
        break;

      case 'flint':     // 采到燧石：清脆的石头相撞声
        playNoise({ freq: 3400, to: 2200, dur: 0.08, gain: 0.16, q: 3.2 });
        playTone({ freq: 1850, to: 1250, dur: 0.1, type: 'square', gain: 0.05 });
        break;

      case 'flintfind': // 燧石堆出现：远处一声轻轻的提示
        playTone({ freq: 784, dur: 0.22, type: 'sine', gain: 0.07 });
        playTone({ freq: 1047, dur: 0.3, type: 'sine', gain: 0.06, delay: 0.16 });
        break;

      case 'break':     // 工具用坏了：一声断裂
        playNoise({ freq: 1400, to: 240, dur: 0.22, gain: 0.16, q: 1.1 });
        playTone({ freq: 300, to: 120, dur: 0.26, type: 'triangle', gain: 0.12 });
        break;

      case 'berry':     // 摘浆果：轻轻一拽
        playNoise({ freq: 1500, to: 900, dur: 0.09, gain: 0.09, q: 1.4 });
        playTone({ freq: 900, to: 1200, dur: 0.12, type: 'sine', gain: 0.07, delay: 0.03 });
        break;

      case 'shell':     // 捡贝壳：沙沙的一下
        playNoise({ freq: 2600, to: 1400, dur: 0.12, gain: 0.10, q: 1.8 });
        playTone({ freq: 1500, to: 1900, dur: 0.1, type: 'sine', gain: 0.05, delay: 0.02 });
        break;

      default:
        break;
    }
  }

  /**
   * 触感反馈
   * 在 App 里走 Taptic 引擎；普通浏览器退回到系统振动（安卓有效，iOS Safari 没有这个接口）
   */
  function buzz(name) {
    if (!Sound.enabled) return;

    if (typeof window.__haptic === 'function') {
      try {
        window.__haptic(name);
      } catch (e) { /* 忽略 */ }
      return;
    }

    if (navigator.vibrate) {
      const pattern = name === 'craft' ? [12, 40, 18]
        : name === 'catch' ? [10, 45, 10]
        : [14];
      try { navigator.vibrate(pattern); } catch (e) { /* 忽略 */ }
    }
  }

  /** 饥饿度低时的心跳：越饿跳得越快 */
  function updateHeartbeat(dt) {
    if (state.gameOver) return;

    const ratio = state.hunger / HUNGER_MAX;
    if (ratio > 0.25) {
      state.heartT = 0;
      return;
    }

    // 25% 时约 1.5 秒一次，快饿晕时约 0.7 秒一次
    const interval = 0.7 + (ratio / 0.25) * 0.8;
    state.heartT -= dt;
    if (state.heartT <= 0) {
      state.heartT = interval;
      sfx('heart');
    }
  }

  /** 刷新音效按钮的图标 */
  function syncSoundUI() {
    soundBtn.classList.toggle('off', !Sound.enabled);
    soundBtn.setAttribute('aria-label', Sound.enabled ? '关闭音效' : '开启音效');
  }

  /** 开关音效 */
  function toggleSound() {
    Sound.enabled = !Sound.enabled;
    saveSoundPref();
    syncSoundUI();

    if (Sound.enabled) {
      audioCtx();        // 现在才真正创建音频上下文
      startAmbient();
      sfx('click');
      showToast('音效已开启');
    } else {
      stopAmbient();
      showToast('音效已关闭');
    }
  }

  // ==================================================================
  // 12. 存档（存在浏览器本地，关掉网页再打开还能接着玩）
  // ==================================================================
  const SAVE_KEY = 'island-survival-save-v1';

  /** 存档：把关键数值和资源的存活状态写进 localStorage */
  function saveGame() {
    try {
      if (state.gameOver) {
        localStorage.removeItem(SAVE_KEY);
        return;
      }

      const data = {
        v: 5,
        wood: state.wood,
        stone: state.stone,
        flint: state.flint,
        fish: state.fish,
        food: state.food,
        cooked: state.cooked,
        berry: state.berry,
        shell: state.shell,
        hunger: state.hunger,
        hasAxe: state.hasAxe,
        hasPick: state.hasPick,
        hasBench: state.hasBench,
        hasCampfire: state.hasCampfire,
        hasTorch: state.hasTorch,
        hasRod: state.hasRod,
        axeUses: state.axeUses,
        pickUses: state.pickUses,
        day: state.day,
        clock: state.clock,
        duskWarned: state.duskWarned,
        rare: {
          active: state.rare.active,
          x: state.rare.x / (world.W || 1),
          y: state.rare.y / (world.H || 1),
          life: state.rare.life,
          wait: state.rare.wait
        },
        farm: {
          built: state.farm.built,
          planted: state.farm.planted,
          growth: state.farm.growth,
          ready: state.farm.ready
        },
        // 每棵树 / 石头：a = 是否还立着，r = 还有多少秒长回来
        trees: state.trees.map(t => ({ a: t.alive ? 1 : 0, r: Math.round(t.regrow * 10) / 10 })),
        rocks: state.rocks.map(r => ({ a: r.alive ? 1 : 0, r: Math.round(r.regrow * 10) / 10 })),
        // 浆果丛：p = 还有没有果子，贝壳：a = 还在不在
        bushes: state.bushes.map(b => ({ p: b.ripe ? 1 : 0, r: Math.round(b.regrow * 10) / 10 })),
        shells: state.shells.map(s => ({ a: s.alive ? 1 : 0, r: Math.round(s.regrow * 10) / 10 })),
        // 位置按屏幕比例存，换设备或旋转屏幕都能落回原来的地方
        px: world.W ? state.player.x / world.W : 0.5,
        py: world.H ? state.player.y / world.H : 0.5
      };

      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch (e) {
      // 无痕模式或存储已满：静默放弃，不影响游戏
    }
  }

  /**
   * 还原树 / 石头的存活状态和再生倒计时
   * saved 里现在存的是 {a, r}，早期存档存的是 0 / 1，两种写法都兼容
   */
  function restoreEntities(list, saved, fullTime) {
    if (!Array.isArray(saved)) return;

    list.forEach((e, i) => {
      const d = saved[i];
      if (d && typeof d === 'object') {
        e.alive = !!d.a;
        e.regrow = d.a ? 0 : Math.max(0, Math.min(fullTime, d.r || fullTime));
      } else {
        e.alive = d !== 0;
        e.regrow = e.alive ? 0 : fullTime;
      }
      e.grow = 1;
    });
  }

  /** 读档：有存档就恢复，返回是否恢复成功 */
  function loadGame() {
    let data = null;
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      data = JSON.parse(raw);
    } catch (e) {
      return false;
    }
    if (!data || (data.v !== 1 && data.v !== 2 && data.v !== 3 && data.v !== 4 && data.v !== 5)) return false;

    state.wood = data.wood || 0;
    state.stone = data.stone || 0;
    state.flint = data.flint || 0;
    state.berry = data.berry || 0;
    state.shell = data.shell || 0;
    state.fish = data.fish || 0;
    state.food = data.food || 0;
    state.cooked = data.cooked || 0;
    state.hunger = typeof data.hunger === 'number' ? data.hunger : HUNGER_MAX;
    state.hasAxe = !!data.hasAxe;
    state.hasPick = !!data.hasPick;
    state.hasBench = !!data.hasBench;
    state.hasCampfire = !!data.hasCampfire;
    state.hasTorch = !!data.hasTorch;
    state.hasRod = !!data.hasRod;

    // 工具耐用度：旧存档没有这个字段，就当成刚做好的满耐久
    state.axeUses = typeof data.axeUses === 'number' ? data.axeUses : AXE_USES;
    state.pickUses = typeof data.pickUses === 'number' ? data.pickUses : PICK_USES;
    if (state.axeUses <= 0) state.hasAxe = false;
    if (state.pickUses <= 0) state.hasPick = false;

    // 燧石堆：位置按屏幕比例存，读档时再乘回来
    if (data.rare && data.rare.active) {
      state.rare.active = true;
      state.rare.alive = true;
      state.rare.x = (data.rare.x || 0.5) * world.W;
      state.rare.y = (data.rare.y || 0.5) * world.H;
      state.rare.life = data.rare.life || RARE_LIFE;
      state.rare.appear = 1;
    }
    if (data.rare && typeof data.rare.wait === 'number') {
      state.rare.wait = data.rare.wait;
    }

    // 第几天、当天进度：旧存档没有这些字段就从头开始算
    state.day = data.day || 1;
    state.clock = typeof data.clock === 'number' ? data.clock : DAY_START;
    state.duskWarned = !!data.duskWarned;

    if (data.farm) {
      state.farm.built = !!data.farm.built;
      state.farm.planted = !!data.farm.planted;
      state.farm.growth = data.farm.growth || 0;
      state.farm.ready = !!data.farm.ready;
    }

    // 已经采掉的树和石头保持消失，再生倒计时接着走
    // 新存档存的是 {a, r} 对象，旧存档存的是 0 / 1，两种都认
    restoreEntities(state.trees, data.trees, REGROW_TREE);
    restoreEntities(state.rocks, data.rocks, REGROW_ROCK);
    restoreEntities(state.shells, data.shells, REGROW_SHELL);

    // 浆果丛：存的是"有没有果子"，不是"还在不在"
    if (Array.isArray(data.bushes)) {
      state.bushes.forEach((b, i) => {
        const d = data.bushes[i];
        if (d && typeof d === 'object') {
          b.ripe = !!d.p;
          b.regrow = b.ripe ? 0 : Math.max(0, Math.min(REGROW_BERRY, d.r || REGROW_BERRY));
        }
      });
    }

    // 还原角色位置，落进水里或海里就留在岛心
    const px = (data.px || 0.5) * world.W;
    const py = (data.py || 0.5) * world.H;
    if (isWalkable(px, py)) {
      state.player.x = px;
      state.player.y = py;
    }

    // 存档时已经快饿晕的，留一点血，不要一进来就结束
    if (state.hunger <= 0) state.hunger = 8;

    return true;
  }

  /** 清掉存档（重新开始时用） */
  function clearSave() {
    try {
      localStorage.removeItem(SAVE_KEY);
    } catch (e) { /* 忽略 */ }
  }

  // ==================================================================
  // 13. 启动
  // ==================================================================
  let lastTime = 0;

  function loop(ts) {
    if (!lastTime) lastTime = ts;
    let dt = (ts - lastTime) / 1000;
    lastTime = ts;
    dt = Math.min(dt, 0.05);   // 切到后台再回来时，防止一帧跳太多

    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function init() {
    buildEntities();
    resize();
    resetPlayer();

    buildCraftRows();   // 按配方表生成制作菜单

    // 音效开关是上次的选择
    loadSoundPref();
    syncSoundUI();

    // 有存档就接着上次玩
    if (loadGame()) {
      showToast('已继续上次的进度');
    }

    syncResourceUI();
    syncHungerUI();
    syncCraftMenu();
    syncActionUI();
    syncDayUI();

    // 第一次摸屏幕时解锁音频（iOS 不允许页面自己发声）
    wrap.addEventListener('pointerdown', unlockAudio, { once: true });

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);

    // 切到后台或关掉网页时立刻存一次档
    document.addEventListener('visibilitychange', () => {
      lastTime = 0;
      if (document.visibilityState === 'hidden') saveGame();
    });
    window.addEventListener('pagehide', saveGame);

    setTimeout(hideHint, 7000);   // 提示文字过几秒自己淡出

    requestAnimationFrame(loop);
  }

  init();
})();
</script>
</body>
</html>
